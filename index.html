const Snd = {
  ctx:null, master:null, enabled:true, muted:false,
  init(){ if(this.ctx) return; try{ this.ctx=new(window.AudioContext||window.webkitAudioContext)();
    this.master=this.ctx.createGain(); this.master.gain.value=0.3;
    this.master.connect(this.ctx.destination); }catch(e){this.enabled=false;} },
  tone(f,d,t,v,fEnd){ if(!this.enabled||!this.ctx||this.muted) return;
    const n=this.ctx.currentTime, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=t||'square'; o.frequency.setValueAtTime(f,n);
    if(fEnd) o.frequency.exponentialRampToValueAtTime(Math.max(0.01,fEnd),n+d);
    g.gain.setValueAtTime(v||0.15,n); g.gain.exponentialRampToValueAtTime(0.001,n+d);
    o.connect(g); g.connect(this.master); o.start(n); o.stop(n+d); },
  noise(d,v,ff){ if(!this.enabled||!this.ctx||this.muted) return;
    const n=this.ctx.currentTime, bs=Math.floor(this.ctx.sampleRate*d);
    const buf=this.ctx.createBuffer(1,bs,this.ctx.sampleRate), dt=buf.getChannelData(0);
    for(let i=0;i<bs;i++) dt[i]=Math.random()*2-1;
    const s=this.ctx.createBufferSource(); s.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=ff||1000;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(v||0.1,n);
    g.gain.exponentialRampToValueAtTime(0.001,n+d);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(n); s.stop(n+d); },
  shoot(){this.tone(880,0.06,'square',0.06,220);},
  hit(){this.tone(400,0.04,'square',0.05,200);},
  explode(){this.noise(0.2,0.15,1200); this.tone(160,0.12,'sawtooth',0.08,40);},

function makeMenuBg() {
  const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
  const c = cv.getContext('2d');
  const g = c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgb(255,130,30)'); g.addColorStop(1,'rgb(255,225,90)');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  return cv;
}
function makeGameBg() {
  const cv = document.createElement('canvas'); cv.width=W; cv.height=H;
  const c = cv.getContext('2d');
  const g = c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgb(135,206,235)'); g.addColorStop(0.5,'rgb(180,225,220)'); g.addColorStop(1,'rgb(220,235,170)');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  const sx=W-130, sy=130, sr=60;
  c.strokeStyle='rgb(255,230,80)'; c.lineWidth=5;
  for(let a=0;a<360;a+=20){ const r=a*Math.PI/180;
    c.beginPath(); c.moveTo(sx+Math.cos(r)*(sr+10),sy+Math.sin(r)*(sr+10));
    c.lineTo(sx+Math.cos(r)*(sr+35),sy+Math.sin(r)*(sr+35)); c.stroke(); }
  c.fillStyle='rgb(255,220,60)'; c.beginPath(); c.arc(sx,sy,sr,0,Math.PI*2); c.fill();
  c.fillStyle='rgb(255,245,150)'; c.beginPath(); c.arc(sx,sy,sr-12,0,Math.PI*2); c.fill();
  const cloud=(x,y,w)=>{ c.fillStyle='rgba(255,255,255,0.9)';
    c.beginPath(); c.ellipse(x,y,w/2,w/4,0,0,Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(x+w/3,y-w/4,w/2,w/4,0,0,Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(x+w/2,y,w/2,w/4,0,0,Math.PI*2); c.fill(); };
  cloud(120,120,80); cloud(300,70,60); cloud(500,160,70);
  const layers=[{y:720,color:'rgb(120,170,140)',mts:[[-50,400,200],[200,500,280],[580,350,220]]},
    {y:780,color:'rgb(80,140,100)',mts:[[-100,500,240],[300,600,300],[700,400,250]]},
    {y:840,color:'rgb(60,120,80)',mts:[[0,700,180],[400,600,220]]}];
  for(const L of layers){ c.fillStyle=L.color;
    for(const [mx,mw,mh] of L.mts){ c.beginPath(); c.moveTo(mx,L.y);
      c.lineTo(mx+mw/2,L.y-mh); c.lineTo(mx+mw,L.y); c.closePath(); c.fill(); } }
  c.fillStyle='rgb(70,200,80)'; c.fillRect(0,820,W,H-820);
  return cv;
}

function drawBigBall(c,x,y,r,color,number){ if(r<5)return;
  c.save(); c.shadowColor=color; c.shadowBlur=30;
  c.fillStyle=color; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); c.restore();
  c.strokeStyle='white'; c.lineWidth=Math.max(3,r/12);
  c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.stroke();
  if(r>30){ c.fillStyle='white'; c.font=F.big; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(number||"5",x,y); } }
function drawBossFace(c,x,y,r,bt,hpText){
  c.save(); c.shadowColor=bt.color; c.shadowBlur=40;
  c.fillStyle=bt.color; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); c.restore();
  c.strokeStyle=bt.dark; c.lineWidth=Math.max(3,r/12);
  c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.stroke();
  const eyeY=y-r/4, dxOff=r/3;
  for(const dx of [-dxOff,dxOff]){ c.fillStyle='white';
    c.beginPath(); c.arc(x+dx,eyeY,r/5,0,Math.PI*2); c.fill();
    c.fillStyle='black'; c.beginPath(); c.arc(x+dx,eyeY,r/9,0,Math.PI*2); c.fill(); }
  c.strokeStyle='black'; c.lineWidth=3;
  c.beginPath(); c.moveTo(x-r/2,eyeY-r/3); c.lineTo(x-dxOff+r/8,eyeY-r/8); c.stroke();
  c.beginPath(); c.moveTo(x+r/2,eyeY-r/3); c.lineTo(x+dxOff-r/8,eyeY-r/8); c.stroke();
  c.beginPath(); c.arc(x,y+r/6,r/2,0,Math.PI); c.stroke();
  if(hpText){ c.fillStyle='white'; c.font=F.font; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(hpText,x,y+r/2+20); } }

const particles=[];
const MAX_PARTICLES=200;
class Particle{ constructor(x,y,vx,vy,color,life,size,gravity){
  this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.color=color;
  this.life=life; this.maxLife=life; this.size=size; this.gravity=gravity||0.2; }
  update(dt){ this.x+=this.vx*dt*60; this.y+=this.vy*dt*60; this.vy+=this.gravity*dt*60;
    this.life-=dt; this.vx*=0.98; this.vy*=0.98; }
  draw(c){ const a=Math.max(0,this.life/this.maxLife);
    c.globalAlpha=a; c.fillStyle=this.color;
    c.beginPath(); c.arc(this.x,this.y,this.size*a,0,Math.PI*2); c.fill();
    c.globalAlpha=1; } }
function spawnExplosion(x,y,color,count,power){ count=count||10; power=power||5;
  if(particles.length>MAX_PARTICLES) return;
  for(let i=0;i<count;i++){ const a=Math.random()*Math.PI*2, sp=1+Math.random()*power;
    particles.push(new Particle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,color,0.4+Math.random()*0.5,2+Math.random()*4,0.15)); } }
function spawnHitSparks(x,y,color){ if(particles.length>MAX_PARTICLES) return;
  for(let i=0;i<3;i++){ const a=Math.random()*Math.PI*2, sp=2+Math.random()*3;
    particles.push(new Particle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,color,0.25,2,0.1)); } }

const floatTexts=[];
class FloatText{ constructor(x,y,text,color,big){ this.x=x; this.y=y; this.text=text; this.color=color; this.life=0.9; this.big=!!big; }
  update(dt){ this.y-=1.5*dt*60; this.life-=dt; }
  draw(c){ const a=Math.max(0,this.life/0.9); c.globalAlpha=a; c.fillStyle=this.color;
    c.font=this.big?"bold 28px Arial":F.dmg; c.textAlign='center'; c.textBaseline='middle';
    c.strokeStyle='black'; c.lineWidth=3; c.strokeText(this.text,this.x,this.y);
    c.fillText(this.text,this.x,this.y); c.globalAlpha=1; } }

function loadAll(){
  try {
    const s=localStorage.getItem('bbCollection'); if(s) Game.collection=JSON.parse(s);
    const a=localStorage.getItem('bbAchievements'); if(a) Game.achievements=JSON.parse(a);
    Game.coins=parseInt(localStorage.getItem('bbCoins')||'0',10);
    Game.highScore=parseInt(localStorage.getItem('bbHighScore')||'0',10);
    Game.bossRushBest=parseInt(localStorage.getItem('bbRushBest')||'0',10);
    Game.currentSkin=localStorage.getItem('bbSkin')||'default';
    Game.muted=localStorage.getItem('bbMuted')==='1';
  } catch(e){}
}
function saveAll(){
  try {
    localStorage.setItem('bbCollection',JSON.stringify(Game.collection));
    localStorage.setItem('bbAchievements',JSON.stringify(Game.achievements));
    localStorage.setItem('bbCoins',Game.coins.toString());
    localStorage.setItem('bbHighScore',Game.highScore.toString());
    localStorage.setItem('bbRushBest',Game.bossRushBest.toString());
    localStorage.setItem('bbSkin',Game.currentSkin);
    localStorage.setItem('bbMuted',Game.muted?'1':'0');
  } catch(e){}
}
loadAll();
Snd.muted=Game.muted;
function getSkin(){ return SKINS.find(s=>s.id===Game.currentSkin)||SKINS[0]; }
function getSkinColor(){
  const s=getSkin();
  if(s.color==='rainbow') return rainbow(performance.now()*0.003);
  return s.color;
}
function pickUpgradeChoices(){
  const choices=[]; let att=0;
  while(choices.length<3 && att<200){
    const cand=UPGRADES.filter(u=>!choices.includes(u));
    if(!cand.length) break;
    const total=cand.reduce((s,u)=>s+u.weight,0);
    let r=Math.random()*total, picked=cand[0];
    for(const c of cand){ r-=c.weight; if(r<=0){ picked=c; break; } }
    choices.push(picked); att++;
  }
  return choices;
}
function checkAchievements(){
  for(const a of ACHIEVEMENTS){
    if(!Game.achievements[a.id] && a.c(Game,Game)){
      Game.achievements[a.id]=true; Game.coins+=a.r; saveAll(); showAchievement(a);
    }
  }
}

class Ball{
  constructor(level,x,y,vy,hpBonus,speedBonus){
    this.level=level; this.x=x; this.y=y;
    this.r=LEVELS[level].r;
    this.hp=LEVELS[level].hp+Math.floor(Math.random()*(level+1))+(hpBonus||0);
    if(vy===undefined||vy===null){
      const lo=LEVELS[level].vyMin, hi=LEVELS[level].vyMax;
      this.vy=(lo+Math.random()*(hi-lo))*(1+(speedBonus||0));
    } else this.vy=vy*(1+(speedBonus||0));
    this.slowTimer=0; this.poisonTimer=0; this.poisonDmg=0;
  }
  update(){
    if(this.poisonTimer>0){ this.poisonTimer--;
      if(this.poisonTimer%30===0 && this.poisonDmg>0) this.hp-=this.poisonDmg; }
    if(this.slowTimer>0){ this.slowTimer--; this.y+=this.vy*0.4; }
    else this.y+=this.vy;
  }
  draw(c){
    let color=LEVELS[this.level].color;
    if(this.poisonTimer>0) color='rgb(100,200,60)';
    if(this.slowTimer>0) color='rgb(100,180,255)';
    c.save(); c.shadowColor=color; c.shadowBlur=10;
    c.fillStyle=color; c.beginPath(); c.arc(this.x,this.y,this.r,0,Math.PI*2); c.fill(); c.restore();
    c.strokeStyle='white'; c.lineWidth=3;
    c.beginPath(); c.arc(this.x,this.y,this.r,0,Math.PI*2); c.stroke();
    c.fillStyle='white'; c.font=F.font; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(Math.max(0,this.hp),this.x,this.y);
  }
}
class Bullet{
  constructor(x,y,vx,vy,opts){
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    Object.assign(this,opts); this.hitIds=new Set();
  }
  update(balls,dt){
    if(this.homing>0 && balls && balls.length){
      let near=null, best=1e18;
      for(const b of balls){ const d=Math.hypot(b.x-this.x,b.y-this.y);
        if(d<best){ best=d; near=b; } }
      if(near){ const dx=near.x-this.x, dy=near.y-this.y;
        const dist=Math.hypot(dx,dy)||1, sp=Math.hypot(this.vx,this.vy);
        this.vx+=(dx/dist)*sp*this.homing*0.35;
        this.vy+=(dy/dist)*sp*this.homing*0.35;
        const ns=Math.hypot(this.vx,this.vy)||1;
        this.vx=this.vx/ns*sp; this.vy=this.vy/ns*sp; } }
    this.x+=this.vx*dt*60; this.y+=this.vy*dt*60;
    if(this.ricochet>0){
      if(this.x-this.r<0 && this.vx<0){ this.vx=-this.vx; this.x=this.r; this.ricochet--; }
      else if(this.x+this.r>W && this.vx>0){ this.vx=-this.vx; this.x=W-this.r; this.ricochet--; } }
  }
  draw(c){
    const bodyColor = this.crit ? '#ff6464' : (Game.rageActive ? '#ff3c3c' : '#ffc832');
    const r=this.r;
    c.save(); c.shadowColor=bodyColor; c.shadowBlur=8;
    c.fillStyle=bodyColor; c.fillRect(this.x-r,this.y-r*1.6,r*2,r*3.2); c.restore();
    c.fillStyle='#5096ff'; c.beginPath(); c.arc(this.x,this.y-r*1.6,r,0,Math.PI*2); c.fill();
  }
}
class BossProjectile{
  constructor(x,y,vx,vy,kind,r){ this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.kind=kind||"normal"; this.r=r||12; }
  update(dt){ this.x+=this.vx*dt*60; this.y+=this.vy*dt*60; }
  draw(c){
    const colors={normal:['#ff3c3c','#ffdc64'],poison:['#64dc50','#dcff78'],
      freeze:['#64c8ff','#dcf5ff'],dark:['#3c0064','#9632c8'],
      fire:['#ff6432','#ffe664'],lightning:['#ffe632','#ffffc8']};
    const [c1,c2]=colors[this.kind]||colors.normal;
    c.save(); c.shadowColor=c1; c.shadowBlur=8;
    c.fillStyle=c1; c.beginPath(); c.arc(this.x,this.y,this.r,0,Math.PI*2); c.fill(); c.restore();
    c.fillStyle=c2; c.beginPath(); c.arc(this.x,this.y,Math.max(2,this.r-5),0,Math.PI*2); c.fill();
  }
}
class Boss{
  constructor(level,upgradesCount,bossType,isFinal){
    this.level=level; this.upgradesCount=upgradesCount||0; this.isFinal=!!isFinal;
    this.bossType=bossType||BOSS_TYPES[Math.floor(Math.random()*BOSS_TYPES.length)];
    this.attackKind=this.bossType.attack;
    this.r=isFinal?100:80;
    this.x=W/2; this.y=-this.r-20;
    const baseSpeed=1.6+level*0.25+this.upgradesCount*0.06;
    this.vx=baseSpeed*(isFinal?1.15:1.0);
    let baseHp=50+level*30;
    const mult=1+this.upgradesCount*0.15;
    if(isFinal) baseHp=350;
    this.hpMax=Math.floor(baseHp*mult); this.hp=this.hpMax;
    let baseInterval=130-level*8-this.upgradesCount*3;
    if(isFinal) baseInterval=55;
    this.shootInterval=Math.max(40,baseInterval);
    this.shootTimer=this.shootInterval;
    this.hitFlash=0; this.entered=false;
    this.phase=1;
  }
  update(cx,cy,projectiles,dt){
    if(this.phase===1 && this.hp < this.hpMax*0.5){
      this.phase=2;
      announce("ФАЗА 2!", this.bossType.aura, 1.2);
      shake(10);
    }
    this.x+=this.vx*dt*60;
    if(this.x-this.r<20){ this.x=20+this.r; this.vx=Math.abs(this.vx); }
    if(this.x+this.r>W-20){ this.x=W-20-this.r; this.vx=-Math.abs(this.vx); }
    if(!this.entered){
      this.y+=3*dt*60;
      if(this.y>=150){ this.y=150; this.entered=true; }
    } else {
      this.y=150+Math.sin(performance.now()*0.0015)*15;
      this.y+=0.08*dt*60;
    }
    if(this.hitFlash>0) this.hitFlash--;
    if(this.entered){
      this.shootTimer-=dt*60;
      if(this.shootTimer<=0){
        this.shootTimer = this.shootInterval * (this.phase===2?0.7:1);
        this.shoot(cx,cy,projectiles);
      }
    }
  }
  shoot(cx,cy,projectiles){
    const dx=cx-this.x, dy=cy-this.y;
    const dist=Math.hypot(dx,dy)||1;
    const baseSpeed=3.5+this.level*0.2+this.upgradesCount*0.08;
    const ax=this.x, ay=this.y+this.r*0.6;
    const k=this.attackKind;
    if(k==="poison"){
      for(const off of [-0.2,0.2]){ const ang=Math.atan2(dy,dx)+off;
        projectiles.push(new BossProjectile(ax,ay,Math.cos(ang)*baseSpeed,Math.sin(ang)*baseSpeed,"poison",12)); }
    } else if(k==="dark"){
      projectiles.push(new BossProjectile(ax,ay,dx/dist*baseSpeed*0.6,dy/dist*baseSpeed*0.6,"dark",16));
    } else if(k==="freeze"){
      projectiles.push(new BossProjectile(ax,ay,dx/dist*baseSpeed*0.85,dy/dist*baseSpeed*0.85,"freeze",12));
    } else if(k==="fire"){
      for(const off of [-0.25,0,0.25]){ const ang=Math.atan2(dy,dx)+off;
        projectiles.push(new BossProjectile(ax,ay,Math.cos(ang)*baseSpeed*0.8,Math.sin(ang)*baseSpeed*0.8,"fire",9)); }
    } else if(k==="lightning"){
      projectiles.push(new BossProjectile(ax,ay,dx/dist*baseSpeed*1.5,dy/dist*baseSpeed*1.5,"lightning",8));
    } else if(k==="final"){
      const kinds=["poison","fire","lightning","freeze","dark"];
      const sh=kinds.slice().sort(()=>Math.random()-0.5);
      const count = this.phase===2?3:2;
      for(const kk of sh.slice(0,count)){
        const ang=Math.atan2(dy,dx)+(Math.random()-0.5)*0.5;
        const sp=baseSpeed*(kk==="lightning"?1.3:0.9);
        const rr=kk==="lightning"?8:13;
        projectiles.push(new BossProjectile(ax,ay,Math.cos(ang)*sp,Math.sin(ang)*sp,kk,rr));
      }
    }
  }
  draw(c){
    let c1=this.bossType.color;
    const c2=this.bossType.dark;
    if(this.hitFlash>0) c1='white';
    if(this.isFinal || this.phase===2){
      const t=performance.now()*0.003;
      for(let i=0;i<3;i++){ const rr=this.r+15+i*10;
        const r=Math.floor(128+127*Math.sin(t+i));
        const g=Math.floor(128+127*Math.sin(t+i+2));
        const b=Math.floor(128+127*Math.sin(t+i+4));
        c.strokeStyle=`rgb(${r},${g},${b})`; c.lineWidth=3;
        c.beginPath(); c.arc(this.x,this.y,rr,0,Math.PI*2); c.stroke(); }
    }
    drawBossFace(c,this.x,this.y,this.r,{color:c1,dark:c2},Math.max(0,this.hp).toString());
  }
}
class Cannon{
  constructor(){
    this.w=110; this.h=110;
    this.x=W/2; this.y=H-110;
    this.speed=9;
    this.shootCooldown=0; this.muzzleFlash=0;
    this.baseCooldown=6; this.bulletSpeed=12; this.bulletRadius=6;
    this.damage=1; this.multishot=1; this.pierce=0; this.spread=0.25;
    this.critChance=0; this.critMult=2.0; this.explosiveRadius=0;
    this.homing=0; this.ricochet=0; this.knockback=false;
    this.freezeChance=0; this.poisonTimer=0; this.shield=0;
    this.luckyMult=1.0; this.slowMult=1.0; this.dmgBossMult=1.0;
    this.lifesteal=false; this.upgradesCount=0;
    this.freezePlayerTimer=0; this.image=null;
  }
  update(targetX){
    let sp=this.speed;
    if(this.freezePlayerTimer>0){ sp=this.speed*0.4; this.freezePlayerTimer--; }
    const dx=targetX-this.x;
    if(Math.abs(dx)>3) this.x+=Math.sign(dx)*Math.min(sp,Math.abs(dx));
    this.x=Math.max(this.w/2,Math.min(W-this.w/2,this.x));
    if(this.shootCooldown>0) this.shootCooldown--;
    if(this.muzzleFlash>0) this.muzzleFlash--;
  }
  applyUpgrade(id){
    this.upgradesCount++;
    switch(id){
      case "damage": this.damage++; break;
      case "rate": this.baseCooldown=Math.max(2,this.baseCooldown-1); break;
      case "speed": this.bulletSpeed+=2; break;
      case "size": this.bulletRadius=Math.min(16,this.bulletRadius+2); break;
      case "multishot": this.multishot=Math.min(7,this.multishot+1); break;
      case "pierce": this.pierce++; break;
      case "shotgun": this.multishot=Math.min(9,this.multishot+2); this.spread=Math.min(0.9,this.spread*1.4); break;
      case "crit": this.critChance=Math.min(0.9,this.critChance+0.15); break;
      case "crit_dmg": this.critMult+=1.0; break;
      case "explosive": this.explosiveRadius+=45; break;
      case "homing": this.homing=Math.min(1.0,this.homing+0.4); break;
      case "ricochet": this.ricochet++; break;
      case "knockback": this.knockback=true; break;
      case "freeze": this.freezeChance=Math.min(0.9,this.freezeChance+0.25); break;
      case "poison": this.poisonTimer+=120; break;
      case "move": this.speed+=2; break;
      case "shield": this.shield++; Game.shieldTaken=1; break;
      case "lifesteal": this.lifesteal=true; break;
      case "lucky": this.luckyMult+=0.5; break;
      case "slow": this.slowMult*=0.75; break;
      case "wide": this.spread=Math.min(1.0,this.spread*1.5); break;
      case "narrow": this.spread=Math.max(0.05,this.spread*0.65); break;
      case "dmg_boss": this.dmgBossMult*=2; break;
      case "minigun": this.baseCooldown=Math.max(2,Math.floor(this.baseCooldown/2)); break;
      case "nuke": this.damage+=4; break;
      case "mega_explode": this.explosiveRadius+=150; break;
      case "ice_storm": this.freezeChance=1.0; break;
      case "double_dmg": this.damage*=2; break;
      case "war_god": this.damage+=3; this.multishot=Math.min(9,this.multishot+1); this.pierce+=2; break;
      case "blood_moon": this.lifesteal=true; this.shield+=3; break;
      case "gold_rain": this.luckyMult+=1.5; break;
      case "black_hole": this.homing=1.0; this.explosiveRadius+=100; break;
      case "grand_nuke": this.damage+=10; break;
    }
  }
  shoot(){
    if(this.shootCooldown>0) return [];
    this.shootCooldown=this.baseCooldown; this.muzzleFlash=4;
    Snd.shoot(); shake(1.5);
    const bullets=[]; const n=this.multishot;
    const startY=this.y-this.h/2-10;
    for(let i=0;i<n;i++){
      const angle = n===1 ? 0 : -this.spread + (2*this.spread)*(i/(n-1));
      const vx=Math.sin(angle)*this.bulletSpeed;
      const vy=-Math.cos(angle)*this.bulletSpeed;
      bullets.push(new Bullet(this.x,startY,vx,vy,{
        r:this.bulletRadius, damage:this.damage, pierce:this.pierce,
        crit:Math.random()<this.critChance, explosive:this.explosiveRadius,
        homing:this.homing, ricochet:this.ricochet, knockback:this.knockback,
        freeze:this.freezeChance, poison:this.poisonTimer
      }));
    }
    return bullets;
  }
  draw(c){
    const skinColor = getSkinColor();
    const glow = getSkin().glow;
    if(this.image){
      c.save(); c.shadowColor = Game.rageActive ? '#ff0000' : glow;
      c.shadowBlur = Game.rageActive ? 35 : 18;
      c.drawImage(this.image,this.x-this.w/2,this.y-this.h/2,this.w,this.h);
      c.restore();
    } else {
      c.save();
      if(skinColor){ c.shadowColor = Game.rageActive ? '#ff0000' : glow; c.shadowBlur = Game.rageActive ? 30 : 15; }
      c.fillStyle = skinColor || '#34495e';
      c.fillRect(this.x-this.w/2, this.y-this.h/2, this.w, this.h);
      c.restore();
      c.fillStyle = skinColor || '#2c3e50';
      c.fillRect(this.x-8, this.y-this.h, 16, this.h);
    }
    if(Game.rageActive){
      const t=performance.now()*0.005;
      const r=Math.floor(128+127*Math.sin(t));
      c.strokeStyle=`rgba(255,${r},0,0.7)`; c.lineWidth=4;
      c.beginPath(); c.arc(this.x,this.y,this.w/2+20+Math.sin(t*2)*5,0,Math.PI*2); c.stroke();
    }
    if(this.muzzleFlash>0){
      const fx=this.x, fy=this.y-this.h/2-5;
      c.save(); c.shadowColor='#ffdc64'; c.shadowBlur=30;
      c.fillStyle='#ffff64';
      c.beginPath(); c.arc(fx,fy,16+Math.random()*6,0,Math.PI*2); c.fill();
      c.restore();
    }
    if(this.shield>0){
      for(let i=0;i<this.shield;i++){
        c.save(); c.shadowColor='#64dcff'; c.shadowBlur=12;
        c.strokeStyle='#64dcff'; c.lineWidth=3;
        c.beginPath(); c.arc(this.x,this.y,this.w/2+12+i*8,0,Math.PI*2); c.stroke();
        c.restore();
      }
    }
  }
}
function bossRushNextBoss(){
  Game.rushBossNumber++;
  Game.bossLevel = Game.rushBossNumber;
  const lvl = Game.rushBossNumber;
  // Чередуем боссов
  const bossType = BOSS_TYPES[(lvl-1) % BOSS_TYPES.length];
  const isFinal = lvl >= 25;
  const b = new Boss(lvl, Game.cannon.upgradesCount, isFinal?FINAL_BOSS:bossType, isFinal);
  // Дополнительное усиление в Boss Rush
  b.hpMax = Math.floor(b.hpMax * (1 + lvl*0.05));
  b.hp = b.hpMax;
  b.shootInterval = Math.max(30, b.shootInterval - lvl*2);
  Game.boss = b;
  Game.bossProjectiles = [];
  Game.bossTintColor = b.bossType.color;
  Game.bossTintAmount = 0.15;
  announce("БОСС #" + lvl, b.bossType.aura, 1.5);
}

const BTN = { pause:{x:W-90,y:15,w:75,h:75}, cam:{x:W-90,y:100,w:75,h:75} };

function handlePointerDown(x,y){
  const inBtn=(b)=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
  if(Game.state==='splash'&&Game.stateTime>400){ Game.state='menu'; Game.stateTime=0; Snd.click(); return true; }
  if(Game.state==='menu'){
    if(inBtn({x:W-90,y:15,w:75,h:75})){ Game.muted=!Game.muted; Snd.muted=Game.muted; saveAll(); return true; }
    // Кнопки: Классика, Boss Rush, Коллекция, Достижения, Магазин, Выход
    const bw=440, bh=65, gap=15;
    const cx=W/2, sy=H/2-190;
    const buttons=[
      {y:sy, action:()=>{ Game.state='play'; Game.stateTime=0; startPlay('classic'); }},
      {y:sy+bh+gap, action:()=>{ Game.state='play'; Game.stateTime=0; startPlay('bossrush'); }},
      {y:sy+2*(bh+gap), action:()=>{ Game.state='collection'; Game.stateTime=0; }},
      {y:sy+3*(bh+gap), action:()=>{ Game.state='achievements'; Game.stateTime=0; }},
      {y:sy+4*(bh+gap), action:()=>{ Game.state='shop'; Game.stateTime=0; }},
      {y:sy+5*(bh+gap), action:()=>{ Game.state='splash'; Game.stateTime=0; }}
    ];
    for(const b of buttons){
      if(x>=cx-bw/2 && x<=cx+bw/2 && y>=b.y && y<=b.y+bh){
        Snd.click(); b.action(); return true;
      }
    }
    return false;
  }
  if(Game.state==='collection'||Game.state==='achievements'||Game.state==='shop'){
    if(x<100&&y<100){ Game.state='menu'; Game.stateTime=0; Snd.click(); return true; }
    if(Game.state==='shop'){
      const cardW=300,cardH=130,gx=30,gy=18,cols=2;
      const tw=cols*cardW+(cols-1)*gx, sx=(W-tw)/2, sy=175;
      for(let i=0;i<SKINS.length;i++){
        const row=Math.floor(i/cols), col=i%cols;
        const cx=sx+col*(cardW+gx), cy=sy+row*(cardH+gy);
        if(x>=cx&&x<=cx+cardW&&y>=cy&&y<=cy+cardH){
          const skin=SKINS[i];
          const owned=skin.cost===0||Game.achievements['skin_'+skin.id];
          if(owned){ Game.currentSkin=skin.id; Snd.coin(); saveAll(); }
          else if(Game.coins>=skin.cost){
            Game.coins-=skin.cost;
            Game.achievements['skin_'+skin.id]=true;
            Game.currentSkin=skin.id;
            Snd.coin(); saveAll();
          }
          return true;
        }
      }
    }
    return false;
  }
  if(Game.state==='upgrade'){
    const cardW=560,cardH=110,gap=18;
    const totalH=Game.upgradeChoices.length*cardH+(Game.upgradeChoices.length-1)*gap;
    const startY=(H-totalH)/2+40;
    for(let i=0;i<Game.upgradeChoices.length;i++){
      const cy=startY+i*(cardH+gap), rx=(W-cardW)/2;
      if(x>=rx&&x<=rx+cardW&&y>=cy&&y<=cy+cardH){
        Snd.levelUp();
        Game.cannon.applyUpgrade(Game.upgradeChoices[i].id);
        Game.bigKillsNeeded = 1 + Math.floor(Game.cannon.upgradesCount/3);
        Game.state='play'; Game.paused=false;
        return true;
      }
    }
    return false;
  }
  if(Game.state==='victory'){
    if(Game.stateTime>1500){ Game.victoryPending=false; Game.state='play'; Game.stateTime=0; }
    return true;
  }
  if(Game.state==='play'&&Game.paused){
    if(x>=W/2-150&&x<=W/2+150&&y>=H/2-60&&y<=H/2){
      Game.paused=false; Snd.click(); return true; }
    if(x>=W/2-150&&x<=W/2+150&&y>=H/2+20&&y<=H/2+80){
      Game.paused=false; Game.state='menu'; Game.stateTime=0; Snd.click(); return true; }
    return false;
  }
  if(Game.state==='play'&&Game.gameOver){
    if(x>=W/2-150&&x<=W/2+150&&y>=H/2+70&&y<=H/2+130){
      Game.state='menu'; Game.stateTime=0; Snd.click(); return true; }
    if(x>=W/2-150&&x<=W/2+150&&y>=H/2+150&&y<=H/2+210){
      startPlay(Game.mode); Snd.click(); return true; }
    return false;
  }
  if(Game.state==='play'&&!Game.gameOver){
    if(inBtn(BTN.pause)){ Game.paused=true; Snd.click(); return true; }
    if(inBtn(BTN.cam)){ /* нет filePicker в мобильной */ return true; }
    return false;
  }
  return false;
}
function getPos(cx,cy){ const r=canvas.getBoundingClientRect();
  return {x:(cx-r.left)*(W/r.width), y:(cy-r.top)*(H/r.height)}; }

canvas.addEventListener('touchstart', e=>{
  Snd.init();
  const t=e.changedTouches[0];
  const p=getPos(t.clientX,t.clientY);
  Game.pointer.x=p.x; Game.pointer.y=p.y;
  Game.pointer.down=true; Game.pointer.active=true;
  const tappedBtn=handlePointerDown(p.x,p.y);
  if(!tappedBtn) e.preventDefault();
  if(!tappedBtn && Game.state==='play' && !Game.gameOver && !Game.paused && Game.cannon){
    dragTargetX=Game.cannon.x;
  }
}, {passive:false});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(!e.touches.length) return;
  const t=e.touches[0];
  const p=getPos(t.clientX,t.clientY);
  const dx=p.x-Game.pointer.x;
  Game.pointer.x=p.x; Game.pointer.y=p.y;
  if(dragTargetX!==null && Game.cannon){
    dragTargetX=Math.max(Game.cannon.w/2, Math.min(W-Game.cannon.w/2, dragTargetX+dx));
  }
}, {passive:false});
canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  Game.pointer.down=false;
  dragTargetX=null;
}, {passive:false});
canvas.addEventListener('touchcancel', ()=>{ Game.pointer.down=false; dragTargetX=null; });

function update(dt){
  if(slowmoTimer>0){ slowmoTimer-=dt; dt*=slowmoFactor; }
  Game.stateTime+=dt*1000;
  const frames=dt*60;
  Game.fpsAcc+=dt; Game.fpsFrames++;
  if(Game.fpsAcc>=0.5){ Game.fps=Math.round(Game.fpsFrames/Game.fpsAcc); Game.fpsAcc=0; Game.fpsFrames=0; }
  for(let i=particles.length-1;i>=0;i--){ particles[i].update(dt);
    if(particles[i].life<=0) particles.splice(i,1); }
  for(let i=floatTexts.length-1;i>=0;i--){ floatTexts[i].update(dt);
    if(floatTexts[i].life<=0) floatTexts.splice(i,1); }
  for(let i=achvPopups.length-1;i>=0;i--){ achvPopups[i].life-=dt;
    if(achvPopups[i].life<=0) achvPopups.splice(i,1); }
  shakeAmount*=Math.pow(0.85,dt*60);
  if(shakeAmount<0.1) shakeAmount=0;
  if(Game.announceTimer>0) Game.announceTimer-=dt;
  if(Game.comboTimer>0){ Game.comboTimer-=dt; if(Game.comboTimer<=0) Game.combo=0; }
  if(Game.bossTintAmount>0 && !Game.boss) Game.bossTintAmount=Math.max(0,Game.bossTintAmount-dt*0.5);
  if(Game.hintTimer>0) Game.hintTimer-=dt;

  if(Game.state==='splash'){ if(Game.stateTime>=1900){ Game.state='menu'; Game.stateTime=0; } return; }
  if(Game.state!=='play' || Game.paused) return;
  const cannon=Game.cannon;
  if(!cannon) return;
  const groundY = cannon.y + cannon.h/2 - 5;
  Game.groundY = groundY;

  if(!Game.gameOver){
    // Управление
    if(dragTargetX!==null) cannon.update(dragTargetX);
    const isFiring = Game.pointer.down;
    if(Game.rageActive){ Game.rageTimer-=dt; if(Game.rageTimer<=0) Game.rageActive=false; }
    if(!Game.rageActive && Game.combo>=15){
      Game.rageActive=true; Game.rageTimer=5; Game.rageActivated++;
      announce("ЯРОСТЬ!","#ff3c3c",1.5); Snd.rage(); shake(15); vibrate(80);
    }
    if(isFiring) Game.bullets.push(...cannon.shoot());
    for(const b of Game.bullets) b.update(Game.balls, dt);
    Game.bullets = Game.bullets.filter(b=>b.y>-40 && b.x>-40 && b.x<W+40);

    const hpBonus=Math.floor(cannon.upgradesCount/2);
    const speedBonus=Math.min(0.5,cannon.upgradesCount*0.03);

    if(Game.mode==='classic'){
      // Спавн обычных шаров (только если нет босса)
      if(!Game.boss){
        Game.spawnTimer+=frames;
        if(Game.spawnTimer>=Game.spawnInterval){
          Game.spawnTimer=0;
          Game.spawnInterval=Math.max(55,140-Math.floor(Game.score/4));
          const x=80+Math.random()*(W-160);
          const nb=new Ball(0,x,-60,null,hpBonus,speedBonus);
          nb.vy *= cannon.slowMult;
          Game.balls.push(nb);
        }
      }
      // Спавн финального босса
      if(!Game.boss && !Game.finalBossSpawned && Game.score>=2500){
        Game.boss = new Boss(Game.bossLevel, cannon.upgradesCount, FINAL_BOSS, true);
        Game.bossProjectiles=[]; Game.balls=[];
        Game.finalBossSpawned=true;
        Game.toastText="ФИНАЛЬНЫЙ БОСС!"; Game.toastTimer=180;
        announce("ФИНАЛЬНЫЙ БОСС","#ffc832",2.5); shake(15);
        Game.bossTintColor=FINAL_BOSS.color; Game.bossTintAmount=0.25;
      } else if(!Game.boss && Game.score>=Game.bossThreshold && !Game.finalBossSpawned){
        Game.boss = new Boss(Game.bossLevel, cannon.upgradesCount);
        Game.bossProjectiles=[]; Game.balls=[];
        Game.toastText="БОСС: "+Game.boss.bossType.name+"!"; Game.toastTimer=120;
        announce("БОСС #"+Game.bossLevel+": "+Game.boss.bossType.name, Game.boss.bossType.aura, 2);
        shake(10);
        Game.bossTintColor=Game.boss.bossType.color; Game.bossTintAmount=0.2;
      }
    }
    // В bossrush боссы спавнятся в bossRushNextBoss после победы

    // Хитбокс пушки до земли
    const PAD=20;
    const cx = cannon.x - cannon.w/2 - PAD;
    const cy = cannon.y - cannon.h/2 - PAD;
    const cw = cannon.w + PAD*2;
    const ch = (groundY + 100) - cy;

    // Шары
    for(let i=Game.balls.length-1;i>=0;i--){
      const b=Game.balls[i];
      b.update();
      if(b.hp<=0){ killBall(b,i,hpBonus,speedBonus); continue; }
      let died=false;
      for(let j=Game.bullets.length-1;j>=0;j--){
        const bul=Game.bullets[j];
        if(bul.hitIds.has(b)) continue;
        if(Math.hypot(bul.x-b.x, bul.y-b.y) < b.r+bul.r){
          let dmg = bul.damage;
          if(Game.rageActive) dmg=Math.floor(dmg*1.5);
          if(bul.crit){ dmg=Math.floor(dmg*cannon.critMult); Game.critCount++; }
          b.hp-=dmg;
          bul.hitIds.add(b);
          floatTexts.push(new FloatText(b.x, b.y-b.r-10, '-'+dmg, bul.crit?'#ff6464':'#fff', bul.crit));
          spawnHitSparks(bul.x, bul.y, bul.crit?'#ff6464':'#ffc832');
          Snd.hit();
          if(bul.knockback) b.vy = Math.max(0.3, b.vy-0.8);
          if(bul.freeze>0 && Math.random()<bul.freeze){ b.slowTimer=Math.max(b.slowTimer,120); Game.freezeCount++; }
          if(bul.poison>0){ b.poisonTimer=Math.max(b.poisonTimer,bul.poison); b.poisonDmg=Math.max(b.poisonDmg,1); Game.poisonCount++; }
          if(bul.explosive>0){
            for(const other of Game.balls){
              if(other===b) continue;
              if(Math.hypot(other.x-b.x, other.y-b.y)<bul.explosive) other.hp-=Math.max(1,Math.floor(dmg/2));
            }
            spawnExplosion(b.x, b.y, '#ff8c00', 8, 4);
            Game.explosionCount++;
          }
          if(bul.pierce>0) bul.pierce--;
          else Game.bullets.splice(j,1);
          if(b.hp<=0){ killBall(b,i,hpBonus,speedBonus); died=true; break; }
        }
      }
      if(died) continue;
      // Дошёл до земли — проигрыш
      if(b.y + b.r >= groundY){
        if(cannon.shield>0){
          cannon.shield--; Snd.shield(); vibrate(30);
          Game.balls.splice(i,1);
          spawnExplosion(b.x, b.y, '#64dcff', 12, 5);
        } else {
          Game.gameOver=true; Snd.gameOver(); vibrate(300);
          if(Game.score>Game.highScore) Game.highScore=Game.score;
          if(Game.mode==='bossrush' && Game.rushBossNumber-1 > Game.bossRushBest){
            Game.bossRushBest = Game.rushBossNumber-1;
          }
          saveAll(); shake(20);
        }
      }
    }
    // Босс
    if(Game.boss){
      Game.boss.update(cannon.x, cannon.y, Game.bossProjectiles, dt);
      for(let j=Game.bullets.length-1;j>=0;j--){
        const bul=Game.bullets[j];
        if(bul.hitIds.has(Game.boss)) continue;
        if(Math.hypot(bul.x-Game.boss.x, bul.y-Game.boss.y) < Game.boss.r + bul.r){
          let dmg = bul.damage * cannon.dmgBossMult;
          if(Game.rageActive) dmg*=1.5;
          if(bul.crit){ dmg*=cannon.critMult; Game.critCount++; }
          dmg=Math.floor(dmg);
          Game.boss.hp-=dmg; Game.boss.hitFlash=4;
          bul.hitIds.add(Game.boss);
          floatTexts.push(new FloatText(Game.boss.x+(Math.random()-0.5)*60, Game.boss.y-40, '-'+dmg, '#ff6464', bul.crit));
          spawnHitSparks(bul.x, bul.y, '#ff6464'); Snd.bossHit(); shake(2);
          if(bul.pierce>0) bul.pierce--;
          else Game.bullets.splice(j,1);
        }
      }
      if(Game.boss.hp<=0){
        const bossId = Game.boss.bossType.id;
        Game.collection[bossId] = (Game.collection[bossId]||0) + 1;
        saveAll();
        spawnExplosion(Game.boss.x, Game.boss.y, Game.boss.bossType.color, 40, 8);
        spawnExplosion(Game.boss.x, Game.boss.y, '#ffffff', 20, 6);
        shake(25); vibrate(200); startSlowmo(0.9, 0.3); Snd.bossDie();

        if(Game.mode==='bossrush'){
          Game.score += 100 * Game.rushBossNumber;
          if(Game.boss.isFinal){
            Game.victoryPending = true; Snd.victory();
          } else {
            Game.levelUpTrigger = true;
          }
          Game.boss = null; Game.bossProjectiles=[];
          // Спавним следующего босса после апгрейда
        } else {
          if(Game.boss.isFinal){
            Game.score += Math.floor(500 * cannon.luckyMult);
            Game.victoryPending = true; Snd.victory();
          } else {
            Game.score += Math.floor((50 + Game.bossLevel*30) * cannon.luckyMult);
          }
          for(let k=0;k<8;k++){
            const child=new Ball(3, Game.boss.x+(Math.random()-0.5)*140, Game.boss.y+(Math.random()-0.5)*80, null, hpBonus, speedBonus);
            child.vy *= cannon.slowMult;
            Game.balls.push(child);
          }
          const wasFinal = Game.boss.isFinal;
          Game.boss = null; Game.bossLevel++;
          Game.bossThreshold = Game.score + 250 + Game.bossLevel*50;
          Game.bossProjectiles = [];
          if(!wasFinal){ Game.levelUpTrigger = true; announce("ВОЛНА "+Game.bossLevel, "#ffc828", 1.5); }
        }
      }
      // Снаряды босса
      for(let i=Game.bossProjectiles.length-1;i>=0;i--){
        const p=Game.bossProjectiles[i];
        p.update(dt);
        if(p.y<-40 || p.x<-40 || p.x>W+40){ Game.bossProjectiles.splice(i,1); continue; }
        // Достиг земли — проигрыш
        if(p.y + p.r >= groundY){
          if(cannon.shield>0){
            cannon.shield--; Game.bossProjectiles.splice(i,1); vibrate(30); Snd.shield();
            spawnExplosion(p.x, p.y, '#64dcff', 10, 3);
          } else {
            Game.gameOver=true; Snd.gameOver(); vibrate(300);
            if(Game.score>Game.highScore) Game.highScore=Game.score;
            if(Game.mode==='bossrush' && Game.rushBossNumber-1 > Game.bossRushBest){
              Game.bossRushBest = Game.rushBossNumber-1;
            }
            saveAll(); shake(20); break;
          }
        }
      }
      // Босс дошёл до пушки
      if(Game.boss && Game.boss.y + Game.boss.r >= cannon.y - cannon.h/2){
        Game.gameOver=true; Snd.gameOver(); vibrate(300);
        if(Game.score>Game.highScore) Game.highScore=Game.score;
        if(Game.mode==='bossrush' && Game.rushBossNumber-1 > Game.bossRushBest){
          Game.bossRushBest = Game.rushBossNumber-1;
        }
        saveAll();
      }
    }
    if(Game.toastTimer>0) Game.toastTimer-=frames;
    checkAchievements();
  }
  if(Game.victoryPending){
    if(Game.score>Game.highScore) Game.highScore=Game.score;
    saveAll(); Game.state='victory'; Game.stateTime=0; Game.victoryPending=false;
    return;
  }
  if(Game.levelUpTrigger && !Game.gameOver){
    Game.levelUpTrigger = false;
    Game.upgradeChoices = pickUpgradeChoices();
    Game.state = 'upgrade'; Game.stateTime = 0;
    // Если Boss Rush, после выбора улучшения спавним следующего босса
    if(Game.mode==='bossrush' && !Game.boss){
      Game.pendingBossSpawn = true;
    }
  }
}
function killBall(b,i,hpBonus,speedBonus){
  Game.balls.splice(i,1);
  Game.score += Math.floor(LEVELS[b.level].score * Game.cannon.luckyMult);
  Game.totalKills++; Game.combo++;
  Game.comboTimer = 2.5;
  if(Game.combo > Game.maxCombo) Game.maxCombo = Game.combo;
  if(Game.combo % 5 === 0) Snd.comboup();
  spawnExplosion(b.x, b.y, LEVELS[b.level].color, 12 + b.level*4, 5);
  Snd.explode(); shake(2 + b.level); vibrate(15);
  floatTexts.push(new FloatText(b.x, b.y-20, '+'+Math.floor(LEVELS[b.level].score*Game.cannon.luckyMult), '#ffdc64', false));
  const wasBig = b.level === 0;
  if(b.level + 1 < LEVELS.length){
    for(let k=0;k<2;k++){
      const child=new Ball(b.level+1, b.x+(Math.random()-0.5)*b.r*2, b.y+(Math.random()-0.5)*20, null, hpBonus, speedBonus);
      child.vy *= Game.cannon.slowMult;
      Game.balls.push(child);
    }
  }
  if(wasBig){
    Game.bigKillsCounter++;
    if(Game.cannon.lifesteal) Game.cannon.shield++;
    if(Game.bigKillsCounter >= Game.bigKillsNeeded){
      Game.bigKillsCounter = 0;
      Game.levelUpTrigger = true;
    }
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const inGame = (Game.state==='play'||Game.state==='upgrade'||Game.state==='victory');
  if(inGame){
    if(Game.mode==='bossrush') ctx.drawImage(rushBg,0,0);
    else ctx.drawImage(gameBg,0,0);
    if(Game.bossTintAmount>0 && Game.bossTintColor){
      ctx.globalAlpha=Game.bossTintAmount; ctx.fillStyle=Game.bossTintColor;
      ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
    }
  } else {
    ctx.drawImage(menuBg,0,0);
  }
  ctx.save();
  if(shakeAmount>0.5) ctx.translate((Math.random()-0.5)*shakeAmount, (Math.random()-0.5)*shakeAmount);
  if(Game.state==='splash') drawSplash();
  else if(Game.state==='menu') drawMenu();
  else if(Game.state==='collection') drawCollection();
  else if(Game.state==='achievements') drawAchievements();
  else if(Game.state==='shop') drawShop();
  else if(Game.state==='play'||Game.state==='upgrade'){
    drawPlay();
    if(Game.state==='upgrade') drawUpgrade();
    if(Game.paused) drawPause();
  }
  else if(Game.state==='victory') drawVictory();
  ctx.restore();
  drawAchvPopups();
  const vg = ctx.createRadialGradient(W/2,H/2,H*0.4, W/2,H/2,H*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}
function drawAchvPopups(){
  for(let i=0;i<achvPopups.length;i++){
    const p=achvPopups[i];
    const t=Math.min(1,(3.5-p.life)*4);
    const alpha=Math.min(1,p.life);
    const y=30+i*70-(1-t)*40;
    ctx.globalAlpha=alpha;
    ctx.save(); ctx.shadowColor='#ffdc64'; ctx.shadowBlur=25;
    ctx.fillStyle='rgba(35,42,60,0.95)';
    ctx.fillRect(W/2-280, y, 560, 60); ctx.restore();
    ctx.strokeStyle='#ffdc64'; ctx.lineWidth=3;
    ctx.strokeRect(W/2-280, y, 560, 60);
    ctx.fillStyle='#ffdc64'; ctx.font="bold 26px Arial";
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText("🏆", W/2-255, y+30);
    ctx.fillStyle='white'; ctx.font=F.achv;
    ctx.fillText(p.a.n, W/2-210, y+22);
    ctx.fillStyle='#c8c8c8'; ctx.font=F.upgDesc;
    ctx.fillText(p.a.desc, W/2-210, y+44);
    ctx.fillStyle='#ffdc64'; ctx.font=F.achv;
    ctx.textAlign='right';
    ctx.fillText("+"+p.a.r+" 💰", W/2+260, y+30);
    ctx.globalAlpha=1;
  }
}
function drawSplash(){
  const t=Math.min(1,Game.stateTime/700);
  const ease=1-Math.pow(1-t,3);
  const r=Math.floor(90*ease);
  drawBigBall(ctx, W/2, H/2-130, r, '#e74c3c', "5");
  const alpha=Math.min(1,Math.max(0,(Game.stateTime-400)/600));
  ctx.globalAlpha=alpha; ctx.font=F.huge;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#8c2814'; ctx.fillText("BALL BLAST", W/2+6, H/2+126);
  ctx.fillStyle='white'; ctx.fillText("BALL BLAST", W/2, H/2+120);
  ctx.globalAlpha=alpha*0.7;
  ctx.font=F.font; ctx.fillStyle='#fff0c8';
  ctx.fillText("коснись экрана...", W/2, H-100);
  ctx.globalAlpha=1;
}
function drawMenu(){
  const t=Game.stateTime*0.001*5;
  const pulse=Math.sin(t)*7;
  drawBigBall(ctx, W/2, H/2-380, 75+pulse, '#e74c3c', "5");
  ctx.font=F.big;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#8c2814'; ctx.fillText("BALL BLAST", W/2+5, H/2-265);
  ctx.fillStyle='white'; ctx.fillText("BALL BLAST", W/2, H/2-270);
  ctx.font=F.upg; ctx.fillStyle='#8c5a14';
  ctx.fillText("🏆 " + Game.highScore, W/2-140, H/2-215);
  ctx.fillStyle='#ffd700';
  ctx.fillText("💰 " + Game.coins, W/2+140, H/2-215);

  const bw=440, bh=65, gap=15;
  const cx=W/2, sy=H/2-190;
  // Классика

function drawRoundButton(x,y,w,h,icon,bgColor){
  ctx.save();
  ctx.fillStyle=bgColor||'rgba(0,0,0,0.5)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,15); else ctx.rect(x,y,w,h);
  ctx.fill();
  ctx.strokeStyle='white'; ctx.lineWidth=4;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,15); else ctx.rect(x,y,w,h);
  ctx.stroke();
  ctx.fillStyle='white'; ctx.font="bold 40px Arial";
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(icon, x+w/2, y+h/2+4);
  ctx.restore();
}
function drawButton(text,x,y,w,h,baseColor,hoverColor){
  const isHover = Game.pointer.active && Game.pointer.x>=x && Game.pointer.x<=x+w && Game.pointer.y>=y && Game.pointer.y<=y+h;
  ctx.save();
  ctx.shadowColor = isHover ? hoverColor : baseColor;
  ctx.shadowBlur = isHover ? 30 : 15;
  ctx.fillStyle = isHover ? hoverColor : baseColor;
  ctx.fillRect(x,y,w,h); ctx.restore();
  ctx.strokeStyle='white'; ctx.lineWidth=4;
  ctx.strokeRect(x,y,w,h);
  ctx.fillStyle='white'; ctx.font=F.menu;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, x+w/2, y+h/2);
}
function drawCollection(){
  const all = BOSS_TYPES.concat([FINAL_BOSS]);
  ctx.font=F.big; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#8c2814'; ctx.fillText("КОЛЛЕКЦИЯ", W/2+5, 95);
  ctx.fillStyle='white'; ctx.fillText("КОЛЛЕКЦИЯ", W/2, 90);
  const def = all.filter(b=>(Game.collection[b.id]||0)>0).length;
  ctx.font=F.upg; ctx.fillStyle='#fff0c8';
  ctx.fillText(`Побеждено: ${def} / ${all.length}`, W/2, 145);
  const cw=300, ch=180, gx=30, gy=20, cols=2;
  const tw=cols*cw+(cols-1)*gx;
  const sx=(W-tw)/2, sy=175;
  for(let i=0;i<all.length;i++){
    const bt=all[i];
    const row=Math.floor(i/cols), col=i%cols;
    const x=sx+col*(cw+gx), y=sy+row*(ch+gy);
    const isDef = (Game.collection[bt.id]||0)>0;
    ctx.save(); if(isDef){ ctx.shadowColor=bt.color; ctx.shadowBlur=15; }
    ctx.fillStyle='#232a3c'; ctx.fillRect(x,y,cw,ch); ctx.restore();
    ctx.strokeStyle = isDef ? bt.color : '#505050'; ctx.lineWidth=4;
    ctx.strokeRect(x,y,cw,ch);
    const fx=x+65, fy=y+ch/2, fr=40;
    if(isDef) drawBossFace(ctx, fx, fy, fr, bt);
    else {
      ctx.fillStyle='#3c3c46'; ctx.beginPath(); ctx.arc(fx,fy,fr,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#1e1e28'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(fx,fy,fr,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='#9696a0'; ctx.font=F.big;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText("?", fx, fy);
    }
    ctx.textAlign='left'; ctx.textBaseline='top';
    if(isDef){
      ctx.fillStyle='white'; ctx.font=F.col;
      ctx.fillText(bt.name, x+120, y+40);
      ctx.fillStyle='#ffdc64'; ctx.font=F.upgDesc;
      ctx.fillText(`Побеждён: ${Game.collection[bt.id]||0} раз`, x+120, y+80);
    } else {
      ctx.fillStyle='#9696a0'; ctx.font=F.col;
      ctx.fillText("???", x+120, y+40);
      ctx.fillStyle='#787882'; ctx.font=F.upgDesc;
      ctx.fillText("Ещё не побеждён", x+120, y+80);
    }
  }
  ctx.fillStyle='#fff0c8'; ctx.font=F.upgDesc;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText("Тап в левом верхнем углу — назад", W/2, H-30);
}

function drawShop(){

  ctx.fillText("💰 " + Game.coins, W/2, 145);

function drawPlay(){
  const cannon=Game.cannon;
  if(!cannon) return;
  ctx.strokeStyle = Game.mode==='bossrush' ? 'rgb(180,60,90)' : 'rgb(40,140,50)';
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,Game.groundY); ctx.lineTo(W,Game.groundY); ctx.stroke();
  ctx.fillStyle = Game.mode==='bossrush' ? 'rgba(255,80,120,0.25)' : 'rgba(255,220,80,0.25)';
  ctx.fillRect(cannon.x-cannon.w/2, Game.groundY-4, cannon.w, 12);

  for(const p of particles) p.draw(ctx);
  for(const b of Game.balls) b.draw(ctx);
  for(const p of Game.bossProjectiles) p.draw(ctx);
  for(const b of Game.bullets) b.draw(ctx);
  if(Game.boss) Game.boss.draw(ctx);
  cannon.draw(ctx);
  for(const ft of floatTexts) ft.draw(ctx);

  // Верхняя панель
  ctx.fillStyle='white'; ctx.font=F.font;
  ctx.textAlign='left'; ctx.textBaseline='top';
  if(Game.mode==='bossrush'){
    ctx.fillStyle='#ff6464';
    ctx.font=F.bigMenu;
    ctx.fillText("БОСС #" + Math.max(1,Game.rushBossNumber), 20, 20);
    ctx.font=F.upgDesc; ctx.fillStyle='rgb(200,200,120)';
    ctx.fillText(`Рекорд: босс #${Game.bossRushBest}`, 20, 70);
    ctx.fillText(`Урон ${cannon.damage} • Пули ${cannon.multishot} • Пробой ${cannon.pierce} • Щит ${cannon.shield}`, 20, 95);
  } else {
    ctx.fillText(`Очки: ${Game.score}`, 20, 20);
    ctx.font=F.upgDesc; ctx.fillStyle='rgb(200,200,120)';
    ctx.fillText(`Урон ${cannon.damage} • Пули ${cannon.multishot} • Пробой ${cannon.pierce} • Щит ${cannon.shield}`, 20, 55);
    ctx.fillStyle='rgb(255,200,100)';
    ctx.fillText(`Прокачек: ${cannon.upgradesCount} • До улучшения: ${Game.bigKillsCounter}/${Game.bigKillsNeeded}`, 20, 75);
  }

  drawRoundButton(BTN.pause.x, BTN.pause.y, BTN.pause.w, BTN.pause.h, "⏸", 'rgba(60,60,90,0.85)');

  if(Game.mode==='classic' && !Game.finalBossSpawned){
    const prog=Math.min(1, Game.score/2500);
    const bw=250, bh=14, bx=20, by=100;
    ctx.fillStyle='rgb(40,20,60)'; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='rgb(255,200,50)'; ctx.fillRect(bx,by,bw*prog,bh);
    ctx.strokeStyle='white'; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle='rgb(255,240,180)'; ctx.font=F.upgDesc;
    ctx.textAlign='left';
    ctx.fillText(`ФИНАЛ: ${Game.score}/2500`, bx+bw+8, by);
  }
  // HP босса
  if(Game.boss){
    const bw=W-80, bh=26, bx=40, by = Game.mode==='bossrush' ? 120 : 130;
    ctx.fillStyle='rgb(60,20,30)'; ctx.fillRect(bx,by,bw,bh);
    const ratio=Math.max(0, Game.boss.hp/Game.boss.hpMax);
    ctx.save();
    ctx.shadowColor = Game.boss.isFinal ? '#ff3c78' : '#e63c50';
    ctx.shadowBlur=15;
    ctx.fillStyle = Game.boss.isFinal ? 'rgb(255,60,120)' : 'rgb(230,60,80)';
    ctx.fillRect(bx,by,bw*ratio,bh);
    ctx.restore();
    ctx.strokeStyle='white'; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle='white'; ctx.font=F.boss;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const prefix = Game.boss.isFinal ? "ФИНАЛЬНЫЙ" : (Game.mode==='bossrush' ? `БОСС #${Game.rushBossNumber}` : `БОСС: ${Game.boss.bossType.name}`);
    ctx.fillText(`${prefix}  ${Math.max(0,Game.boss.hp)}/${Game.boss.hpMax}`, W/2, by+bh/2);
  }
  if(Game.rageActive){
    ctx.fillStyle='#ff3c3c'; ctx.font="bold 26px Arial";
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.save(); ctx.shadowColor='#ff3c3c'; ctx.shadowBlur=20;
    ctx.fillText("🔥 ЯРОСТЬ x1.5 " + Math.ceil(Game.rageTimer) + "с", W/2, 175);
    ctx.restore();
  }
  if(Game.combo>1 && Game.mode==='classic'){
    const a=Math.min(1,Game.comboTimer);
    ctx.globalAlpha=a; ctx.font=F.combo;
    ctx.textAlign='right'; ctx.textBaseline='top';
    const cc = Game.combo>=20?'#ff3c78':Game.combo>=10?'#ff8c00':'#ffc832';
    ctx.fillStyle=cc;
    ctx.save(); ctx.shadowColor=cc; ctx.shadowBlur=20;
    ctx.fillText(`x${Game.combo}`, W-100, 200);
    ctx.restore(); ctx.globalAlpha=1;
  }
  if(Game.announceTimer>0){
    const t=Game.announceTimer;
    const a = t>1.7 ? (2-t)/0.3 : Math.min(1, t/0.5);
    ctx.globalAlpha=Math.max(0,Math.min(1,a));
    ctx.font=F.announce;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.save(); ctx.shadowColor=Game.announceColor; ctx.shadowBlur=30;
    ctx.fillStyle='black';
    ctx.fillText(Game.announceText, W/2+4, H/2-80+4);
    ctx.fillStyle=Game.announceColor;
    ctx.fillText(Game.announceText, W/2, H/2-80);
    ctx.restore(); ctx.globalAlpha=1;
  }
  if(Game.toastTimer>0){
    const a=Math.min(1,Game.toastTimer/30);
    ctx.globalAlpha=a; ctx.font=F.upg;
    const tw=ctx.measureText(Game.toastText).width;
    ctx.fillStyle='rgb(40,180,90)';
    ctx.fillRect(W/2-tw/2-12, H/2-160, tw+24, 30);
    ctx.fillStyle='white';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(Game.toastText, W/2, H/2-145);
    ctx.globalAlpha=1;
  }
  if(Game.hintTimer>0 && !Game.gameOver){
    ctx.globalAlpha=Math.min(1,Game.hintTimer);
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect(0, H-110, W, 70);
    ctx.fillStyle='white'; ctx.font="bold 22px Arial";
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText("Веди пальцем по экрану — пушка едет.", W/2, H-82);
    ctx.fillText("Держи палец — стреляет автоматически.", W/2, H-54);
    ctx.globalAlpha=1;
  }
  if(!Game.gameOver){
    ctx.fillStyle='rgb(240,240,240)'; ctx.font=F.hint;
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText("Палец ведёт пушку. Держи — стреляет. ⏸ — пауза.", 20, H-30);
  } else {
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgb(231,76,60)'; ctx.font=F.big;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.save(); ctx.shadowColor='#ff3c3c'; ctx.shadowBlur=30;
    ctx.fillText("GAME OVER", W/2, H/2-200); ctx.restore();
    ctx.fillStyle='white'; ctx.font=F.font;
    if(Game.mode==='bossrush'){
      ctx.fillText(`ДОШЁЛ ДО БОССА #${Math.max(1,Game.rushBossNumber)}`, W/2, H/2-130);
      ctx.fillStyle='#ffdc64'; ctx.font=F.upg;
      ctx.fillText(`Рекорд: босс #${Game.bossRushBest}`, W/2, H/2-90);
    } else {
      ctx.fillText(`Очки: ${Game.score}`, W/2, H/2-130);
      ctx.fillText(`Макс. комбо: x${Game.maxCombo}`, W/2, H/2-90);
      ctx.fillText(`Убито: ${Game.totalKills}`, W/2, H/2-50);
      if(Game.score >= Game.highScore && Game.score > 0){
        ctx.fillStyle='#ffdc64'; ctx.font=F.upg;
        ctx.fillText("🏆 НОВЫЙ РЕКОРД!", W/2, H/2-10);
      }
    }
    drawButton("В МЕНЮ", W/2-150, H/2+70, 300, 60, '#5082dc', '#64a0f0');
    drawButton("ЗАНОВО", W/2-150, H/2+150, 300, 60, '#2eb45a', '#3cd26e');
  }
}

function drawUpgrade(){
  ctx.fillStyle='rgba(0,0,0,0.85)'; ctx.fillRect(0,0,W,H);
  const cw=560, ch=100, gap=15;
  const th=Game.upgradeChoices.length*ch+(Game.upgradeChoices.length-1)*gap;
  const sy=(H-th)/2+30;
  ctx.font=F.upgTitle; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.save(); ctx.shadowColor='#ffe664'; ctx.shadowBlur=30;
  ctx.fillStyle='rgb(255,230,100)';
  ctx.fillText("УЛУЧШЕНИЕ!", W/2, sy-70); ctx.restore();
  ctx.font=F.upgDesc; ctx.fillStyle='rgb(200,200,200)';
  ctx.fillText("Тап по карточке", W/2, sy-32);
  for(let i=0;i<Game.upgradeChoices.length;i++){
    const up=Game.upgradeChoices[i];
    const cy=sy+i*(ch+gap); const rx=(W-cw)/2;
    const isHover = Game.pointer.active && Game.pointer.x>=rx && Game.pointer.x<=rx+cw && Game.pointer.y>=cy && Game.pointer.y<=cy+ch;
    ctx.save(); ctx.shadowColor=TIER_RING[up.tier]; ctx.shadowBlur=isHover?25:10;
    ctx.fillStyle = isHover ? 'rgb(60,70,95)' : 'rgb(35,42,60)';
    ctx.fillRect(rx,cy,cw,ch); ctx.restore();
    ctx.strokeStyle = TIER_RING[up.tier] || '#b4b4b4'; ctx.lineWidth=4;
    ctx.strokeRect(rx,cy,cw,ch);
    ctx.save(); ctx.shadowColor=up.color; ctx.shadowBlur=15;
    ctx.fillStyle=up.color;
    ctx.beginPath(); ctx.arc(rx+55, cy+ch/2, 30, 0, Math.PI*2); ctx.fill(); ctx.restore();
    ctx.fillStyle='white'; ctx.font=F.big;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText((i+1).toString(), rx+55, cy+ch/2);
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillStyle='white'; ctx.font=F.upg;
    ctx.fillText(up.name, rx+110, cy+20);
    ctx.fillStyle='rgb(200,200,200)'; ctx.font=F.upgDesc;
    ctx.fillText(up.desc, rx+110, cy+52);
    ctx.textAlign='right'; ctx.textBaseline='top';
    ctx.fillStyle = TIER_RING[up.tier] || '#b4b4b4'; ctx.font=F.upgDesc;
    ctx.fillText(up.tier.toUpperCase(), rx+cw-15, cy+10);
  }
}
function drawVictory(){
  const el=Game.stateTime;
  const pulse=Math.sin(el*0.005)*10;
  if(Math.random()<0.3){
    const x=Math.random()*W, y=Math.random()*H*0.5;
    const colors=['#ff3c78','#ffdc64','#3cd2ff','#3cdc64','#c83cff'];
    spawnExplosion(x,y,colors[Math.floor(Math.random()*colors.length)],15,6);
  }
  for(const p of particles) p.draw(ctx);
  drawBossFace(ctx, W/2, H/2-100, 90+pulse, FINAL_BOSS);
  ctx.font=F.big; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.save(); ctx.shadowColor='#ffe664'; ctx.shadowBlur=40;
  ctx.fillStyle='#8c2814'; ctx.fillText("ПОБЕДА!", W/2+5, H/2+85);
  ctx.fillStyle='white'; ctx.fillText("ПОБЕДА!", W/2, H/2+80); ctx.restore();
  ctx.font=F.font; ctx.fillStyle='white';
  if(Game.mode==='bossrush'){
    ctx.fillText(`Пройдено боссов: ${Game.rushBossNumber}`, W/2, H/2+160);
  } else {
    ctx.fillText(`Очки: ${Game.score}`, W/2, H/2+160);
    ctx.fillText(`Комбо: x${Game.maxCombo} • Убито: ${Game.totalKills}`, W/2, H/2+200);
  }
  ctx.font=F.upg; ctx.fillStyle='#fff0c8';
  ctx.fillText("Тап — продолжить", W/2, H-80);
}

// Обработка "pendingBossSpawn" для bossrush после выбора улучшения
const _origHandle = handlePointerDown;
window._pendingCheck = setInterval(()=>{
  if(Game.pendingBossSpawn && Game.state==='play' && !Game.boss && !Game.gameOver){
    Game.pendingBossSpawn = false;
    bossRushNextBoss();
  }
}, 100);

let lastTime=performance.now();
function loop(now){
  const dt=Math.min(0.1,(now-lastTime)/1000);
  lastTime=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
