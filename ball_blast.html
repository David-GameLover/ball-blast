const Audio_ = {
  ctx: null, master: null, enabled: true,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.enabled = false; }
  },
  tone(freq, dur, type, vol, freqEnd) {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(0.01, freqEnd), t + dur);
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + dur);
  },
  noise(dur, vol, ff) {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const bs = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, bs, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bs; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const filt = this.ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = ff || 1000;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol || 0.1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(filt); filt.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur);
  },
  shoot()    { this.tone(880, 0.08, 'square', 0.08, 220); },
  hit()      { this.tone(400, 0.05, 'square', 0.06, 200); },
  explode()  { this.noise(0.25, 0.18, 1200); this.tone(160, 0.15, 'sawtooth', 0.1, 40); },
  bossHit()  { this.tone(220, 0.12, 'sawtooth', 0.12, 80); },

// ==================== HELPERS ====================
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}
function rainbow(t) {
  const r = Math.floor(128 + 127 * Math.sin(t));
  const g = Math.floor(128 + 127 * Math.sin(t + 2));
  const b = Math.floor(128 + 127 * Math.sin(t + 4));
  return `rgb(${r},${g},${b})`;
}
function drawBigBall(c, x, y, r, color, number) {
  if (r < 5) return;
  c.save();
  c.shadowColor = color; c.shadowBlur = 30;
  c.fillStyle = color;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill();
  c.restore();
  const hl = c.createRadialGradient(x - r/3, y - r/3, 2, x, y, r);
  hl.addColorStop(0, 'rgba(255,255,255,0.55)');
  hl.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = hl;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill();
  c.strokeStyle = 'white'; c.lineWidth = Math.max(3, r/12);
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.stroke();
  if (r > 30) {
    c.fillStyle = 'white'; c.font = F.big;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(number || "5", x, y);
  }
}
function drawBossFace(c, x, y, r, bt, hpText) {
  c.save();
  c.shadowColor = bt.color; c.shadowBlur = 40;
  c.fillStyle = bt.color;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill();
  c.restore();
  const hl = c.createRadialGradient(x - r/3, y - r/3, 2, x, y, r);
  hl.addColorStop(0, 'rgba(255,255,255,0.6)');
  hl.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = hl;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill();
  c.strokeStyle = bt.dark; c.lineWidth = Math.max(3, r/12);
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.stroke();
  const eyeY = y - r/4, dxOff = r/3;
  for (const dx of [-dxOff, dxOff]) {
    c.fillStyle = 'white';
    c.beginPath(); c.arc(x+dx, eyeY, r/5, 0, Math.PI*2); c.fill();
    c.fillStyle = 'black';
    c.beginPath(); c.arc(x+dx, eyeY, r/9, 0, Math.PI*2); c.fill();
  }
  c.strokeStyle = 'black'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(x-r/2, eyeY-r/3); c.lineTo(x-dxOff+r/8, eyeY-r/8); c.stroke();
  c.beginPath(); c.moveTo(x+r/2, eyeY-r/3); c.lineTo(x+dxOff-r/8, eyeY-r/8); c.stroke();
  c.beginPath(); c.arc(x, y+r/6, r/2, 0, Math.PI); c.stroke();
  if (hpText) {
    c.fillStyle = 'white'; c.font = F.font;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(hpText, x, y + r/2 + 20);
  }
}

// ==================== PARTICLES ====================
const particles = [];
class Particle {
  constructor(x, y, vx, vy, color, life, size, gravity) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.color = color; this.life = life; this.maxLife = life;
    this.size = size; this.gravity = gravity || 0.2;
  }
  update(dt) {
    this.x += this.vx * dt * 60;
    this.y += this.vy * dt * 60;
    this.vy += this.gravity * dt * 60;
    this.life -= dt;
    this.vx *= 0.98; this.vy *= 0.98;
  }
  draw(c) {
    const a = Math.max(0, this.life / this.maxLife);
    c.globalAlpha = a;
    c.fillStyle = this.color;
    c.beginPath(); c.arc(this.x, this.y, this.size * a, 0, Math.PI*2); c.fill();
    c.globalAlpha = 1;
  }
}
function spawnExplosion(x, y, color, count, power) {
  count = count || 20; power = power || 5;
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * power;
    particles.push(new Particle(x, y, Math.cos(ang)*sp, Math.sin(ang)*sp,
      color, 0.4 + Math.random()*0.5, 2 + Math.random()*4, 0.15));
  }
}
function spawnHitSparks(x, y, color) {

    const ang = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 3;
    particles.push(new Particle(x, y, Math.cos(ang)*sp, Math.sin(ang)*sp, color, 0.25, 2, 0.1));
  }
}
function spawnTrail(x, y, color) {

}

function pickUpgradeChoices() {
  const choices = [];
  let attempts = 0;
  while (choices.length < 3 && attempts < 200) {
    const candidates = UPGRADES.filter(u => !choices.includes(u));
    if (!candidates.length) break;
    const totalW = candidates.reduce((s, u) => s + u.weight, 0);
    let r = Math.random() * totalW;
    let picked = candidates[0];
    for (const c of candidates) { r -= c.weight; if (r <= 0) { picked = c; break; } }
    choices.push(picked); attempts++;
  }
  return choices;
}

function getMousePos(e) {

}

function handleClick(x, y) {
  if (Game.state === 'splash' && Game.stateTime > 400) { Game.state = 'menu'; Game.stateTime = 0; Audio_.click(); return; }
  if (Game.state === 'menu') {
    const startBtn = { x: W/2-200, y: H/2+20, w: 400, h: 70 };
    const colBtn   = { x: W/2-200, y: H/2+100, w: 400, h: 70 };
    const achBtn   = { x: W/2-200, y: H/2+180, w: 400, h: 70 };
    const shopBtn  = { x: W/2-200, y: H/2+260, w: 400, h: 70 };
    const quitBtn  = { x: W/2-200, y: H/2+340, w: 400, h: 70 };
    const check = (b) => x >= b.x && x <= b.x+b.w && y >= b.y && y <= b.y+b.h;
    if (check(startBtn)) { Audio_.click(); Game.state = 'play'; Game.stateTime = 0; startPlay(); }
    else if (check(colBtn)) { Audio_.click(); Game.state = 'collection'; Game.stateTime = 0; }
    else if (check(achBtn)) { Audio_.click(); Game.state = 'achievements'; Game.stateTime = 0; }
    else if (check(shopBtn)) { Audio_.click(); Game.state = 'shop'; Game.stateTime = 0; }
    else if (check(quitBtn)) { Audio_.click(); Game.state = 'splash'; Game.stateTime = 0; }
  } else if (Game.state === 'collection' || Game.state === 'achievements' || Game.state === 'shop') {
    if (x < 100 && y < 100) { Game.state = 'menu'; Game.stateTime = 0; Audio_.click(); }
    if (Game.state === 'shop') {
      // Skin buttons
      const cardW = 320, cardH = 160, gap = 20;
      const cols = 2;
      const totalW = cols * cardW + (cols-1) * gap;
      const startX = (W - totalW) / 2;
      const startY = 180;
      for (let i = 0; i < SKINS.length; i++) {
        const row = Math.floor(i / cols);
        const col = i % cols;
        const cx = startX + col * (cardW + gap);
        const cy = startY + row * (cardH + gap);
        if (x >= cx && x <= cx+cardW && y >= cy && y <= cy+cardH) {
          const skin = SKINS[i];
          const owned = skin.cost === 0 || Game.achievements['skin_' + skin.id];
          if (owned || Game.coins >= skin.cost) {
            if (!owned) {
              Game.coins -= skin.cost;
              Game.achievements['skin_' + skin.id] = true;
            }
            Game.currentSkin = skin.id;
            Audio_.coin();
            saveAll();
          }
          break;
        }
      }
    }
  } else if (Game.state === 'upgrade') {
    const cardW = 560, cardH = 110, gap = 18;
    const totalH = Game.upgradeChoices.length * cardH + (Game.upgradeChoices.length-1) * gap;
    const startY = (H - totalH) / 2 + 40;
    for (let i = 0; i < Game.upgradeChoices.length; i++) {
      const cy = startY + i * (cardH + gap);
      const rx = (W - cardW) / 2;
      if (x >= rx && x <= rx + cardW && y >= cy && y <= cy + cardH) {
        Audio_.levelUp();
        Game.cannon.applyUpgrade(Game.upgradeChoices[i].id);
        Game.bigKillsNeeded = 1 + Math.floor(Game.cannon.upgradesCount / 3);
        Game.state = 'play'; Game.paused = false;
        break;
      }
    }
  } else if (Game.state === 'victory') {
    if (Game.stateTime > 1500) { Game.victoryPending = false; Game.state = 'play'; Game.stateTime = 0; }
  } else if (Game.state === 'play' && Game.paused) {
    // Pause menu
    const resumeBtn = { x: W/2-150, y: H/2-60, w: 300, h: 60 };
    const menuBtn   = { x: W/2-150, y: H/2+20, w: 300, h: 60 };
    const check = (b) => x >= b.x && x <= b.x+b.w && y >= b.y && y <= b.y+b.h;
    if (check(resumeBtn)) { Game.paused = false; Audio_.click(); }
    else if (check(menuBtn)) { Game.paused = false; Game.state = 'menu'; Game.stateTime = 0; }
  }
}

document.getElementById('filePicker').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      if (!Game.cannon) return;
      const tmp = document.createElement('canvas');
      tmp.width = 110; tmp.height = 110;
      const tc = tmp.getContext('2d');
      const ratio = Math.min(110/img.width, 110/img.height);
      const nw = img.width * ratio, nh = img.height * ratio;
      tc.drawImage(img, (110-nw)/2, (110-nh)/2, nw, nh);
      try {
        const id = tc.getImageData(0, 0, 110, 110);
        const d = id.data;
        const getPx = (x, y) => { const i = (y*110+x)*4; return [d[i], d[i+1], d[i+2]]; };
        const corners = [getPx(0,0), getPx(109,0), getPx(0,109), getPx(109,109)];
        const tol = 60;
        const match = (r,g,b) => corners.some(([cr,cg,cb]) => Math.abs(r-cr)<=tol && Math.abs(g-cg)<=tol && Math.abs(b-cb)<=tol);
        const visited = new Uint8Array(110*110);
        const queue = [[0,0],[109,0],[0,109],[109,109]];
        for (const [x,y] of queue) visited[y*110+x] = 1;
        while (queue.length) {
          const [x,y] = queue.shift();
          const i = (y*110+x)*4;
          if (!match(d[i],d[i+1],d[i+2])) continue;
          d[i+3] = 0;
          for (const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
            const nx = x+dx, ny = y+dy;
            if (nx<0||ny<0||nx>=110||ny>=110) continue;
            const ni = ny*110+nx;
            if (!visited[ni]) { visited[ni]=1; queue.push([nx,ny]); }
          }
        }
        tc.putImageData(id, 0, 0);
      } catch (err) {}
      const out = new Image();
      out.onload = () => { Game.cannon.image = out; };
      out.src = tmp.toDataURL();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

class Ball {
  constructor(level, x, y, vy, hpBonus, speedBonus) {
    this.level = level; this.x = x; this.y = y;
    this.r = LEVELS[level].r;
    this.hp = LEVELS[level].hp + Math.floor(Math.random() * (level + 1)) + (hpBonus || 0);
    if (vy === undefined || vy === null) {
      const lo = LEVELS[level].vyMin, hi = LEVELS[level].vyMax;
      this.vy = (lo + Math.random() * (hi - lo)) * (1 + (speedBonus || 0));
    } else this.vy = vy * (1 + (speedBonus || 0));
    this.slowTimer = 0; this.poisonTimer = 0; this.poisonDmg = 0;
  }
  update() {
    if (this.poisonTimer > 0) {
      this.poisonTimer--;
      if (this.poisonTimer % 30 === 0 && this.poisonDmg > 0) this.hp -= this.poisonDmg;
    }
    if (this.slowTimer > 0) { this.slowTimer--; this.y += this.vy * 0.4; }
    else this.y += this.vy;
  }
  draw(c) {
    let color = LEVELS[this.level].color;
    if (this.poisonTimer > 0) color = 'rgb(100,200,60)';
    if (this.slowTimer > 0) color = 'rgb(100,180,255)';
    c.save();
    c.shadowColor = color; c.shadowBlur = 20;
    c.fillStyle = color;
    c.beginPath(); c.arc(this.x, this.y, this.r, 0, Math.PI*2); c.fill();
    c.restore();
    const hl = c.createRadialGradient(this.x - this.r/3, this.y - this.r/3, 2, this.x, this.y, this.r);
    hl.addColorStop(0, 'rgba(255,255,255,0.5)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = hl;
    c.beginPath(); c.arc(this.x, this.y, this.r, 0, Math.PI*2); c.fill();
    c.strokeStyle = 'white'; c.lineWidth = 3;
    c.beginPath(); c.arc(this.x, this.y, this.r, 0, Math.PI*2); c.stroke();
    c.fillStyle = 'white'; c.font = F.font;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(Math.max(0, this.hp), this.x, this.y);
  }
}

class Bullet {
  constructor(x, y, vx, vy, opts) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    Object.assign(this, opts);
    this.hitIds = new Set();
    this.trailTimer = 0;
  }
  update(balls, dt) {
    if (this.homing > 0 && balls && balls.length) {
      let nearest = null, best = 1e18;
      for (const b of balls) {
        const d = Math.hypot(b.x - this.x, b.y - this.y);
        if (d < best) { best = d; nearest = b; }
      }
      if (nearest) {
        const dx = nearest.x - this.x, dy = nearest.y - this.y;
        const dist = Math.hypot(dx, dy) || 1;
        const sp = Math.hypot(this.vx, this.vy);
        this.vx += (dx/dist) * sp * this.homing * 0.35;
        this.vy += (dy/dist) * sp * this.homing * 0.35;
        const ns = Math.hypot(this.vx, this.vy) || 1;
        this.vx = this.vx / ns * sp;
        this.vy = this.vy / ns * sp;
      }
    }
    this.x += this.vx * dt * 60;
    this.y += this.vy * dt * 60;
    if (this.ricochet > 0) {
      if (this.x - this.r < 0 && this.vx < 0) { this.vx = -this.vx; this.x = this.r; this.ricochet--; }
      else if (this.x + this.r > W && this.vx > 0) { this.vx = -this.vx; this.x = W - this.r; this.ricochet--; }
    }
    this.trailTimer += dt;
    if (this.trailTimer > 0.03) {
      this.trailTimer = 0;
      spawnTrail(this.x, this.y, this.crit ? '#ff6464' : '#ffc832');
    }
  }
  draw(c) {
    const bodyColor = this.crit ? '#ff6464' : (Game.rageActive ? '#ff3c3c' : '#ffc832');
    const r = this.r;
    c.save();
    c.shadowColor = bodyColor; c.shadowBlur = 15;
    c.fillStyle = bodyColor;
    c.fillRect(this.x - r, this.y - r*1.6, r*2, r*3.2);
    c.restore();
    c.fillStyle = '#5096ff';
    c.beginPath(); c.arc(this.x, this.y - r*1.6, r, 0, Math.PI*2); c.fill();
  }
}

class BossProjectile {
  constructor(x, y, vx, vy, kind, r) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.kind = kind || "normal"; this.r = r || 12;
    this.trailTimer = 0;
  }
  update(dt) {
    this.x += this.vx * dt * 60;
    this.y += this.vy * dt * 60;
    this.trailTimer += dt;
    if (this.trailTimer > 0.05) {
      this.trailTimer = 0;
      const colors = { poison:'#64dc50', freeze:'#64c8ff', dark:'#9632c8', fire:'#ff6432', lightning:'#ffe632', normal:'#ff3c3c' };
      spawnTrail(this.x, this.y, colors[this.kind] || '#ff3c3c');
    }
  }
  draw(c) {
    const colors = {
      normal:    ['#ff3c3c', '#ffdc64'], poison:    ['#64dc50', '#dcff78'],
      freeze:    ['#64c8ff', '#dcf5ff'], dark:      ['#3c0064', '#9632c8'],
      fire:      ['#ff6432', '#ffe664'], lightning: ['#ffe632', '#ffffc8'],
    };
    const [c1, c2] = colors[this.kind] || colors.normal;
    c.save();
    c.shadowColor = c1; c.shadowBlur = 15;
    c.fillStyle = c1;
    c.beginPath(); c.arc(this.x, this.y, this.r, 0, Math.PI*2); c.fill();
    c.restore();
    c.fillStyle = c2;
    c.beginPath(); c.arc(this.x, this.y, Math.max(2, this.r-5), 0, Math.PI*2); c.fill();
  }
}

class Boss {
  constructor(level, upgradesCount, bossType, isFinal) {
    this.level = level;
    this.upgradesCount = upgradesCount || 0;
    this.isFinal = !!isFinal;
    this.bossType = bossType || BOSS_TYPES[Math.floor(Math.random() * BOSS_TYPES.length)];
    this.attackKind = this.bossType.attack;
    this.r = isFinal ? 100 : 80;
    this.x = W/2; this.y = -this.r - 20;
    const baseSpeed = 1.6 + level*0.25 + this.upgradesCount*0.06;
    this.vx = baseSpeed * (isFinal ? 1.15 : 1.0);
    let baseHp = 50 + level*30;
    const mult = 1 + this.upgradesCount*0.15;
    if (isFinal) baseHp = 350;
    this.hpMax = Math.floor(baseHp * mult);
    this.hp = this.hpMax;
    let baseInterval = 130 - level*8 - this.upgradesCount*3;
    if (isFinal) baseInterval = 55;
    this.shootInterval = Math.max(40, baseInterval);
    this.shootTimer = this.shootInterval;
    this.hitFlash = 0; this.entered = false;
  }
  update(cx, cy, projectiles, dt) {
    this.x += this.vx * dt * 60;
    if (this.x - this.r < 20) { this.x = 20 + this.r; this.vx = Math.abs(this.vx); }
    if (this.x + this.r > W - 20) { this.x = W - 20 - this.r; this.vx = -Math.abs(this.vx); }
    if (!this.entered) {
      this.y += 3 * dt * 60;
      if (this.y >= 150) { this.y = 150; this.entered = true; }
    } else {
      this.y = 150 + Math.sin(performance.now()*0.0015) * 15;
      this.y += 0.08 * dt * 60;
    }
    if (this.hitFlash > 0) this.hitFlash--;
    if (this.entered) {
      this.shootTimer -= dt * 60;
      if (this.shootTimer <= 0) {
        this.shootTimer = this.shootInterval;
        this.shoot(cx, cy, projectiles);
      }
    }
  }
  shoot(cx, cy, projectiles) {
    const dx = cx - this.x, dy = cy - this.y;
    const dist = Math.hypot(dx, dy) || 1;
    const baseSpeed = 3.5 + this.level*0.2 + this.upgradesCount*0.08;
    const ax = this.x, ay = this.y + this.r*0.6;
    const k = this.attackKind;
    if (k === "poison") {
      for (const off of [-0.2, 0.2]) {
        const ang = Math.atan2(dy, dx) + off;
        projectiles.push(new BossProjectile(ax, ay, Math.cos(ang)*baseSpeed, Math.sin(ang)*baseSpeed, "poison", 12));
      }
    } else if (k === "dark") {
      projectiles.push(new BossProjectile(ax, ay, dx/dist*baseSpeed*0.6, dy/dist*baseSpeed*0.6, "dark", 16));
    } else if (k === "freeze") {
      projectiles.push(new BossProjectile(ax, ay, dx/dist*baseSpeed*0.85, dy/dist*baseSpeed*0.85, "freeze", 12));
    } else if (k === "fire") {
      for (const off of [-0.25, 0, 0.25]) {
        const ang = Math.atan2(dy, dx) + off;
        projectiles.push(new BossProjectile(ax, ay, Math.cos(ang)*baseSpeed*0.8, Math.sin(ang)*baseSpeed*0.8, "fire", 9));
      }
    } else if (k === "lightning") {
      projectiles.push(new BossProjectile(ax, ay, dx/dist*baseSpeed*1.5, dy/dist*baseSpeed*1.5, "lightning", 8));
    } else if (k === "final") {
      const kinds = ["poison", "fire", "lightning", "freeze", "dark"];
      const shuffled = kinds.slice().sort(() => Math.random() - 0.5);
      for (const kk of shuffled.slice(0, 2)) {
        const ang = Math.atan2(dy, dx) + (Math.random()-0.5)*0.5;
        const sp = baseSpeed * (kk === "lightning" ? 1.3 : 0.9);
        const rr = kk === "lightning" ? 8 : 13;
        projectiles.push(new BossProjectile(ax, ay, Math.cos(ang)*sp, Math.sin(ang)*sp, kk, rr));
      }
    }
  }
  draw(c) {
    let c1 = this.bossType.color;
    const c2 = this.bossType.dark;
    if (this.hitFlash > 0) c1 = 'white';
    if (this.isFinal) {
      const t = performance.now()*0.003;
      for (let i = 0; i < 3; i++) {
        const rr = this.r + 15 + i*10;
        const r = Math.floor(128 + 127*Math.sin(t+i));
        const g = Math.floor(128 + 127*Math.sin(t+i+2));
        const b = Math.floor(128 + 127*Math.sin(t+i+4));
        c.strokeStyle = `rgb(${r},${g},${b})`; c.lineWidth = 3;
        c.beginPath(); c.arc(this.x, this.y, rr, 0, Math.PI*2); c.stroke();
      }
    }
    drawBossFace(c, this.x, this.y, this.r, { color: c1, dark: c2 }, Math.max(0, this.hp).toString());
  }
}

class Cannon {
  constructor() {
    this.w = 110; this.h = 110;
    this.x = W/2; this.y = H - 110;
    this.speed = 9;
    this.shootCooldown = 0; this.muzzleFlash = 0;
    this.baseCooldown = 6; this.bulletSpeed = 12; this.bulletRadius = 6;
    this.damage = 1; this.multishot = 1; this.pierce = 0; this.spread = 0.25;
    this.critChance = 0; this.critMult = 2.0; this.explosiveRadius = 0;
    this.homing = 0; this.ricochet = 0; this.knockback = false;
    this.freezeChance = 0; this.poisonTimer = 0; this.shield = 0;
    this.luckyMult = 1.0; this.slowMult = 1.0; this.dmgBossMult = 1.0;
    this.lifesteal = false; this.upgradesCount = 0;
    this.freezePlayerTimer = 0;
    this.image = null;
  }
  update(keys) {
    let sp = this.speed;
    if (this.freezePlayerTimer > 0) { sp = this.speed * 0.4; this.freezePlayerTimer--; }
    if (keys['ArrowLeft'] || keys['a'] || keys['A'] || keys['ф'] || keys['Ф']) this.x -= sp;
    if (keys['ArrowRight'] || keys['d'] || keys['D'] || keys['в'] || keys['В']) this.x += sp;
    this.x = Math.max(this.w/2, Math.min(W - this.w/2, this.x));
    if (this.shootCooldown > 0) this.shootCooldown--;
    if (this.muzzleFlash > 0) this.muzzleFlash--;
  }
  applyUpgrade(id) {
    this.upgradesCount++;
    switch (id) {
      case "damage": this.damage++; break;
      case "rate": this.baseCooldown = Math.max(2, this.baseCooldown - 1); break;
      case "speed": this.bulletSpeed += 2; break;
      case "size": this.bulletRadius = Math.min(16, this.bulletRadius + 2); break;
      case "multishot": this.multishot = Math.min(7, this.multishot + 1); break;
      case "pierce": this.pierce++; break;
      case "shotgun": this.multishot = Math.min(9, this.multishot + 2); this.spread = Math.min(0.9, this.spread * 1.4); break;
      case "crit": this.critChance = Math.min(0.9, this.critChance + 0.15); break;
      case "crit_dmg": this.critMult += 1.0; break;
      case "explosive": this.explosiveRadius += 45; break;
      case "homing": this.homing = Math.min(1.0, this.homing + 0.4); break;
      case "ricochet": this.ricochet++; break;
      case "knockback": this.knockback = true; break;
      case "freeze": this.freezeChance = Math.min(0.9, this.freezeChance + 0.25); break;
      case "poison": this.poisonTimer += 120; break;
      case "move": this.speed += 2; break;
      case "shield": this.shield++; break;
      case "lifesteal": this.lifesteal = true; break;
      case "lucky": this.luckyMult += 0.5; break;
      case "slow": this.slowMult *= 0.75; break;
      case "wide": this.spread = Math.min(1.0, this.spread * 1.5); break;
      case "narrow": this.spread = Math.max(0.05, this.spread * 0.65); break;
      case "dmg_boss": this.dmgBossMult *= 2; break;
      case "minigun": this.baseCooldown = Math.max(2, Math.floor(this.baseCooldown / 2)); break;
      case "nuke": this.damage += 4; break;
      case "mega_explode": this.explosiveRadius += 150; break;
      case "ice_storm": this.freezeChance = 1.0; break;
      case "double_dmg": this.damage *= 2; break;
      case "war_god": this.damage += 3; this.multishot = Math.min(9, this.multishot + 1); this.pierce += 2; break;
      case "blood_moon": this.lifesteal = true; this.shield += 3; break;
      case "gold_rain": this.luckyMult += 1.5; break;
      case "black_hole": this.homing = 1.0; this.explosiveRadius += 100; break;
      case "grand_nuke": this.damage += 10; break;
    }
  }
  shoot() {
    if (this.shootCooldown > 0) return [];
    this.shootCooldown = this.baseCooldown;
    this.muzzleFlash = 4;
    Audio_.shoot();
    shake(2);
    const bullets = [];
    const n = this.multishot;
    const startY = this.y - this.h/2 - 10;
    for (let i = 0; i < n; i++) {
      const angle = n === 1 ? 0 : -this.spread + (2*this.spread) * (i / (n - 1));
      const vx = Math.sin(angle) * this.bulletSpeed;
      const vy = -Math.cos(angle) * this.bulletSpeed;
      bullets.push(new Bullet(this.x, startY, vx, vy, {
        r: this.bulletRadius, damage: this.damage, pierce: this.pierce,
        crit: Math.random() < this.critChance, explosive: this.explosiveRadius,
        homing: this.homing, ricochet: this.ricochet, knockback: this.knockback,
        freeze: this.freezeChance, poison: this.poisonTimer,
      }));
    }
    for (let i = 0; i < 8; i++) {
      const ang = -Math.PI/2 + (Math.random()-0.5)*1.2;
      const sp = 3 + Math.random()*3;
      particles.push(new Particle(this.x, startY, Math.cos(ang)*sp, Math.sin(ang)*sp,
        Game.rageActive ? '#ff3c3c' : '#ffff64', 0.2, 2 + Math.random()*3, 0.1));
    }
    return bullets;
  }
  draw(c) {
    const skinColor = getSkinColor();
    const glow = getSkin().glow;
    if (this.image) {
      c.save();
      c.shadowColor = Game.rageActive ? '#ff0000' : glow;
      c.shadowBlur = Game.rageActive ? 35 : 20;
      c.drawImage(this.image, this.x - this.w/2, this.y - this.h/2, this.w, this.h);
      c.restore();
    } else {
      c.save();
      if (skinColor) {
        c.shadowColor = Game.rageActive ? '#ff0000' : glow;
        c.shadowBlur = Game.rageActive ? 30 : 15;
      }
      c.fillStyle = skinColor || '#34495e';
      c.fillRect(this.x - this.w/2, this.y - this.h/2, this.w, this.h);
      c.restore();
      // Barrel
      c.fillStyle = skinColor || '#2c3e50';
      c.fillRect(this.x - 8, this.y - this.h, 16, this.h);
      // Highlight
      c.fillStyle = 'rgba(255,255,255,0.2)';
      c.fillRect(this.x - this.w/2 + 5, this.y - this.h/2 + 5, this.w - 10, 15);
    }
    // Rage aura
    if (Game.rageActive) {
      const t = performance.now() * 0.005;
      const r = Math.floor(128 + 127 * Math.sin(t));
      c.strokeStyle = `rgba(255,${r},0,0.7)`; c.lineWidth = 4;
      c.beginPath(); c.arc(this.x, this.y, this.w/2 + 20 + Math.sin(t*2)*5, 0, Math.PI*2); c.stroke();
    }
    if (this.muzzleFlash > 0) {
      const fx = this.x, fy = this.y - this.h/2 - 5;
      c.save();
      c.shadowColor = '#ffdc64'; c.shadowBlur = 40;
      c.fillStyle = '#ffff64';
      c.beginPath(); c.arc(fx, fy, 18 + Math.random()*8, 0, Math.PI*2); c.fill();
      c.fillStyle = '#ffc832';
      c.beginPath(); c.arc(fx, fy, 10, 0, Math.PI*2); c.fill();
      c.restore();
    }
    if (this.shield > 0) {
      for (let i = 0; i < this.shield; i++) {
        const radius = this.w/2 + 12 + i*8;
        c.save();
        c.shadowColor = '#64dcff'; c.shadowBlur = 15;
        c.strokeStyle = '#64dcff'; c.lineWidth = 3;
        c.beginPath(); c.arc(this.x, this.y, radius, 0, Math.PI*2); c.stroke();
        c.restore();
      }
    }
    if (this.freezePlayerTimer > 0) {
      c.strokeStyle = '#96dcff'; c.lineWidth = 2;
      c.beginPath(); c.arc(this.x, this.y, this.w/2 + 20, 0, Math.PI*2); c.stroke();
    }
  }
}

// ==================== UPDATE ====================
function update(dt) {
  // Slow-mo
  if (slowmoTimer > 0) {
    slowmoTimer -= dt;
    dt *= slowmoFactor;
  }

  Game.stateTime += dt * 1000;
  const frames = dt * 60;

  Game.fpsAcc += dt; Game.fpsFrames++;
  if (Game.fpsAcc >= 0.5) { Game.fps = Math.round(Game.fpsFrames / Game.fpsAcc); Game.fpsAcc = 0; Game.fpsFrames = 0; }

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(dt);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    floatTexts[i].update(dt);
    if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
  }
  for (let i = achvPopups.length - 1; i >= 0; i--) {
    achvPopups[i].life -= dt;
    if (achvPopups[i].life <= 0) achvPopups.splice(i, 1);
  }
  shakeAmount *= Math.pow(0.85, dt * 60);
  if (shakeAmount < 0.1) shakeAmount = 0;
  if (Game.announceTimer > 0) Game.announceTimer -= dt;
  if (Game.comboTimer > 0) { Game.comboTimer -= dt; if (Game.comboTimer <= 0) Game.combo = 0; }

  // Boss tint fade
  if (Game.bossTintAmount > 0 && !Game.boss) Game.bossTintAmount = Math.max(0, Game.bossTintAmount - dt * 0.5);

  if (Game.state === 'splash') {
    if (Game.stateTime >= 1900) { Game.state = 'menu'; Game.stateTime = 0; }
    return;
  }
  if (Game.state !== 'play' || Game.paused) return;

  const cannon = Game.cannon;
  if (!cannon) return;
  const groundY = cannon.y + cannon.h/2 - 5;
  Game.groundY = groundY;

  if (!Game.gameOver) {
    cannon.update(Game.keys);
    // Rage timer
    if (Game.rageActive) {
      Game.rageTimer -= dt;
      if (Game.rageTimer <= 0) { Game.rageActive = false; }
    }
    // Rage activation at combo 15
    if (!Game.rageActive && Game.combo >= 15) {
      Game.rageActive = true;
      Game.rageTimer = 5;
      Game.rageActivated++;
      announce("ЯРОСТЬ!", "#ff3c3c", 1.5);
      Audio_.rage();
      shake(15);
    }
    const shooting = Game.keys[' '] || Game.keys['ArrowUp'] || Game.keys['w'] || Game.keys['W'] ||
                     Game.keys['ц'] || Game.keys['Ц'] || Game.mouse.down;
    if (shooting) Game.bullets.push(...cannon.shoot());
    for (const b of Game.bullets) b.update(Game.balls, dt);
    Game.bullets = Game.bullets.filter(b => b.y > -40 && b.x > -40 && b.x < W + 40);

    const hpBonus = Math.floor(cannon.upgradesCount / 2);
    const speedBonus = Math.min(0.5, cannon.upgradesCount * 0.03);

    if (!Game.boss) {
      Game.spawnTimer += frames;
      if (Game.spawnTimer >= Game.spawnInterval) {
        Game.spawnTimer = 0;
        Game.spawnInterval = Math.max(55, 140 - Math.floor(Game.score / 4));
        const x = 80 + Math.random() * (W - 160);
        const nb = new Ball(0, x, -60, null, hpBonus, speedBonus);
        nb.vy *= cannon.slowMult;
        Game.balls.push(nb);
      }
    }

    if (!Game.boss && !Game.finalBossSpawned && Game.score >= 2500) {
      Game.boss = new Boss(Game.bossLevel, cannon.upgradesCount, FINAL_BOSS, true);
      Game.bossProjectiles = []; Game.balls = [];
      Game.finalBossSpawned = true;
      Game.toastText = "ФИНАЛЬНЫЙ БОСС!"; Game.toastTimer = 180;
      announce("ФИНАЛЬНЫЙ БОСС", "#ffc832", 2.5);
      shake(15);
      Game.bossTintColor = FINAL_BOSS.color; Game.bossTintAmount = 0.25;
    } else if (!Game.boss && Game.score >= Game.bossThreshold && !Game.finalBossSpawned) {
      Game.boss = new Boss(Game.bossLevel, cannon.upgradesCount);
      Game.bossProjectiles = []; Game.balls = [];
      Game.toastText = "БОСС: " + Game.boss.bossType.name + "!"; Game.toastTimer = 120;
      announce("БОСС #" + Game.bossLevel + ": " + Game.boss.bossType.name, Game.boss.bossType.aura, 2);
      shake(10);
      Game.bossTintColor = Game.boss.bossType.color; Game.bossTintAmount = 0.2;
    }

    for (let i = Game.balls.length - 1; i >= 0; i--) {
      const b = Game.balls[i];
      b.update();
      if (b.hp <= 0) { killBall(b, i, hpBonus, speedBonus); continue; }
      let died = false;
      for (let j = Game.bullets.length - 1; j >= 0; j--) {
        const bul = Game.bullets[j];
        if (bul.hitIds.has(b)) continue;
        if (Math.hypot(bul.x - b.x, bul.y - b.y) < b.r + bul.r) {
          let dmg = bul.damage;
          if (Game.rageActive) dmg = Math.floor(dmg * 1.5);
          if (bul.crit) dmg = Math.floor(dmg * cannon.critMult);
          b.hp -= dmg;
          bul.hitIds.add(b);
          floatTexts.push(new FloatText(b.x, b.y - b.r - 10, '-' + dmg,
            bul.crit ? '#ff6464' : '#ffffff', bul.crit));
          spawnHitSparks(bul.x, bul.y, bul.crit ? '#ff6464' : '#ffc832');
          Audio_.hit();
          if (bul.knockback) b.vy = Math.max(0.3, b.vy - 0.8);
          if (bul.freeze > 0 && Math.random() < bul.freeze) b.slowTimer = Math.max(b.slowTimer, 120);
          if (bul.poison > 0) { b.poisonTimer = Math.max(b.poisonTimer, bul.poison); b.poisonDmg = Math.max(b.poisonDmg, 1); }
          if (bul.explosive > 0) {
            for (const other of Game.balls) {
              if (other === b) continue;
              if (Math.hypot(other.x - b.x, other.y - b.y) < bul.explosive) other.hp -= Math.max(1, Math.floor(dmg / 2));
            }
            spawnExplosion(b.x, b.y, '#ff8c00', 10, 4);
          }
          if (bul.pierce > 0) bul.pierce--;
          else Game.bullets.splice(j, 1);
          if (b.hp <= 0) { killBall(b, i, hpBonus, speedBonus); died = true; break; }
        }
      }
      if (died) continue;
      const cx = cannon.x - cannon.w/2, cy = cannon.y - cannon.h/2;
      if (b.x - b.r < cx + cannon.w && b.x + b.r > cx && b.y - b.r < cy + cannon.h && b.y + b.r > cy) {
        if (cannon.shield > 0) {
          cannon.shield--; Audio_.shield(); Game.balls.splice(i, 1);
          spawnExplosion(b.x, b.y, '#64dcff', 15, 5);
          Game.shieldUsed = true;
        } else {
          Game.gameOver = true; Audio_.gameOver();
          if (Game.score > Game.highScore) { Game.highScore = Game.score; }
          saveAll();
          shake(20);
        }
      }
    }

    if (Game.boss) {
      Game.boss.update(cannon.x, cannon.y, Game.bossProjectiles, dt);
      for (let j = Game.bullets.length - 1; j >= 0; j--) {
        const bul = Game.bullets[j];
        if (bul.hitIds.has(Game.boss)) continue;
        if (Math.hypot(bul.x - Game.boss.x, bul.y - Game.boss.y) < Game.boss.r + bul.r) {
          let dmg = bul.damage * cannon.dmgBossMult;
          if (Game.rageActive) dmg *= 1.5;
          if (bul.crit) dmg *= cannon.critMult;
          dmg = Math.floor(dmg);
          Game.boss.hp -= dmg;
          Game.boss.hitFlash = 4;
          bul.hitIds.add(Game.boss);
          floatTexts.push(new FloatText(Game.boss.x + (Math.random()-0.5)*60, Game.boss.y - 40, '-' + dmg, '#ff6464', bul.crit));
          spawnHitSparks(bul.x, bul.y, '#ff6464');
          Audio_.bossHit();
          shake(3);
          if (bul.pierce > 0) bul.pierce--;
          else Game.bullets.splice(j, 1);
        }
      }
      if (Game.boss.hp <= 0) {
        const bossId = Game.boss.bossType.id;
        Game.collection[bossId] = (Game.collection[bossId] || 0) + 1;
        saveAll();
        spawnExplosion(Game.boss.x, Game.boss.y, Game.boss.bossType.color, 60, 8);
        spawnExplosion(Game.boss.x, Game.boss.y, '#ffffff', 30, 6);
        shake(25);
        startSlowmo(0.9, 0.3);
        Audio_.bossDie();
        if (Game.boss.isFinal) {
          Game.score += Math.floor(500 * cannon.luckyMult);
          Game.victoryPending = true; Audio_.victory();
        } else Game.score += Math.floor((50 + Game.bossLevel * 30) * cannon.luckyMult);
        for (let k = 0; k < 8; k++) {
          const child = new Ball(3, Game.boss.x + (Math.random()-0.5)*140, Game.boss.y + (Math.random()-0.5)*80, null, hpBonus, speedBonus);
          child.vy *= cannon.slowMult;
          Game.balls.push(child);
        }
        const wasFinal = Game.boss.isFinal;
        Game.boss = null;
        Game.bossLevel++;
        Game.bossThreshold = Game.score + 250 + Game.bossLevel * 50;
        Game.bossProjectiles = [];
        if (!wasFinal) { Game.levelUpTrigger = true; announce("ВОЛНА " + Game.bossLevel, "#ffc828", 1.5); }
      }
      for (let i = Game.bossProjectiles.length - 1; i >= 0; i--) {
        const p = Game.bossProjectiles[i];
        p.update(dt);
        if (p.y < -40 || p.x < -40 || p.x > W + 40) { Game.bossProjectiles.splice(i, 1); continue; }
        if (p.y > cannon.y) { Game.bossProjectiles.splice(i, 1); continue; }
        if (p.y + p.r > cannon.y - cannon.h/3 && Math.abs(p.x - cannon.x) < cannon.w/2) {
          if (cannon.shield > 0) {
            cannon.shield--; Game.bossProjectiles.splice(i, 1);
            Audio_.shield(); spawnExplosion(p.x, p.y, '#64dcff', 10, 3);
            Game.shieldUsed = true;
          } else if (p.kind === "freeze") {
            cannon.freezePlayerTimer = 120; Game.bossProjectiles.splice(i, 1);
          } else {
            Game.gameOver = true; Audio_.gameOver();
            if (Game.score > Game.highScore) { Game.highScore = Game.score; }
            saveAll();
            shake(20);
            break;
          }
        }
      }
      if (Game.boss && Game.boss.y + Game.boss.r >= cannon.y - cannon.h/2) {
        Game.gameOver = true; Audio_.gameOver();
        if (Game.score > Game.highScore) { Game.highScore = Game.score; }
        saveAll();
      }
    }

    if (Game.toastTimer > 0) Game.toastTimer -= frames;

    // Achievement checks
    if (!Game.score500 && Game.score >= 500) {
      Game.score500 = true;
      if (!Game.shieldUsed) Game.shieldless500 = true;
    }
    checkAchievements();
  }

  if (Game.victoryPending) {
    if (Game.score > Game.highScore) Game.highScore = Game.score;
    saveAll();
    Game.state = 'victory'; Game.stateTime = 0; Game.victoryPending = false;
    return;
  }
  if (Game.levelUpTrigger && !Game.gameOver) {
    Game.levelUpTrigger = false;
    Game.upgradeChoices = pickUpgradeChoices();
    Game.state = 'upgrade'; Game.stateTime = 0;
  }
}

function killBall(b, i, hpBonus, speedBonus) {
  Game.balls.splice(i, 1);
  Game.score += Math.floor(LEVELS[b.level].score * Game.cannon.luckyMult);
  Game.totalKills++;
  Game.combo++;
  Game.comboTimer = 2.5;
  if (Game.combo > Game.maxCombo) Game.maxCombo = Game.combo;
  if (Game.combo % 5 === 0) Audio_.comboup();
  spawnExplosion(b.x, b.y, LEVELS[b.level].color, 15 + b.level * 5, 5);
  Audio_.explode();
  shake(3 + b.level);
  floatTexts.push(new FloatText(b.x, b.y - 20, '+' + Math.floor(LEVELS[b.level].score * Game.cannon.luckyMult), '#ffdc64', false));
  const wasBig = b.level === 0;
  if (b.level + 1 < LEVELS.length) {
    for (let k = 0; k < 2; k++) {
      const child = new Ball(b.level + 1, b.x + (Math.random()-0.5)*b.r*2, b.y + (Math.random()-0.5)*20, null, hpBonus, speedBonus);
      child.vy *= Game.cannon.slowMult;
      Game.balls.push(child);
    }
  }
  if (wasBig) {
    Game.bigKillsCounter++;
    if (Game.cannon.lifesteal) Game.cannon.shield++;
    if (Game.bigKillsCounter >= Game.bigKillsNeeded) {
      Game.bigKillsCounter = 0;
      Game.levelUpTrigger = true;
    }
  }
}

// ==================== DRAW ====================
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (Game.state === 'splash' || Game.state === 'menu' || Game.state === 'collection' ||
      Game.state === 'achievements' || Game.state === 'shop' || Game.state === 'victory') {
    ctx.drawImage(menuBg, 0, 0);
  } else {
    ctx.drawImage(gameBg, 0, 0);
    // Boss tint
    if (Game.bossTintAmount > 0 && Game.bossTintColor) {
      ctx.globalAlpha = Game.bossTintAmount;
      ctx.fillStyle = Game.bossTintColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  ctx.save();
  if (shakeAmount > 0.5) {
    ctx.translate((Math.random()-0.5) * shakeAmount, (Math.random()-0.5) * shakeAmount);
  }

  if (Game.state === 'splash') drawSplash();
  else if (Game.state === 'menu') drawMenu();
  else if (Game.state === 'collection') drawCollection();
  else if (Game.state === 'achievements') drawAchievements();
  else if (Game.state === 'shop') drawShop();
  else if (Game.state === 'play' || Game.state === 'upgrade') {
    drawPlay();
    if (Game.state === 'upgrade') drawUpgrade();
    if (Game.paused) drawPause();
  }
  else if (Game.state === 'victory') drawVictory();

  ctx.restore();

  // Achievement popups (always on top)
  drawAchvPopups();

  // Vignette
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.4, W/2, H/2, H*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function drawAchvPopups() {
  for (let i = 0; i < achvPopups.length; i++) {
    const p = achvPopups[i];
    const t = Math.min(1, (3.5 - p.life) * 4);
    const alpha = Math.min(1, p.life);
    const y = 30 + i * 70 - (1 - t) * 40;
    ctx.globalAlpha = alpha;
    ctx.save();
    ctx.shadowColor = '#ffdc64'; ctx.shadowBlur = 30;
    ctx.fillStyle = 'rgba(35,42,60,0.95)';
    ctx.fillRect(W/2 - 280, y, 560, 60);
    ctx.restore();
    ctx.strokeStyle = '#ffdc64'; ctx.lineWidth = 3;
    ctx.strokeRect(W/2 - 280, y, 560, 60);
    ctx.fillStyle = '#ffdc64';
    ctx.font = "bold 26px Arial";
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText("🏆", W/2 - 255, y + 30);
    ctx.fillStyle = 'white'; ctx.font = F.achv;
    ctx.fillText(p.a.name, W/2 - 210, y + 22);
    ctx.fillStyle = '#c8c8c8'; ctx.font = F.upgDesc;
    ctx.fillText(p.a.desc, W/2 - 210, y + 44);
    ctx.fillStyle = '#ffdc64'; ctx.font = F.achv;
    ctx.textAlign = 'right';
    ctx.fillText("+" + p.a.reward + " 💰", W/2 + 260, y + 30);
    ctx.globalAlpha = 1;
  }
}

function drawSplash() {
  const t = Math.min(1, Game.stateTime / 700);
  const ease = 1 - Math.pow(1 - t, 3);
  const r = Math.floor(90 * ease);
  const bounce = Game.stateTime > 700 ? Math.sin(Game.stateTime * 0.01) * 6 : 0;
  drawBigBall(ctx, W/2, H/2 - 130 + bounce, r, '#e74c3c', "5");
  const alpha = Math.min(1, Math.max(0, (Game.stateTime - 400) / 600));
  ctx.globalAlpha = alpha;
  ctx.font = F.huge;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#8c2814';
  ctx.fillText("BALL BLAST", W/2 + 6, H/2 + 126);
  ctx.fillStyle = 'white';
  ctx.fillText("BALL BLAST", W/2, H/2 + 120);
  ctx.globalAlpha = alpha * 0.7;
  ctx.font = F.font;
  ctx.fillStyle = '#fff0c8';
  ctx.fillText("нажми, чтобы начать...", W/2, H - 100);
  ctx.globalAlpha = 1;
}

function drawMenu() {
  const t = Game.stateTime * 0.001 * 5;
  const pulse = Math.sin(t) * 7;
  drawBigBall(ctx, W/2, H/2 - 320, 75 + pulse, '#e74c3c', "5");
  ctx.font = F.big;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#8c2814';
  ctx.fillText("BALL BLAST", W/2 + 5, H/2 - 195);
  ctx.fillStyle = 'white';
  ctx.fillText("BALL BLAST", W/2, H/2 - 200);
  if (Game.highScore > 0) {
    ctx.font = F.upg;
    ctx.fillStyle = '#8c5a14';
    ctx.fillText("🏆 РЕКОРД: " + Game.highScore, W/2 - 100, H/2 - 145);
    ctx.fillStyle = '#ffd700';
    ctx.fillText("💰 " + Game.coins, W/2 + 110, H/2 - 145);
  } else {
    ctx.font = F.upg;
    ctx.fillStyle = '#ffd700';
    ctx.fillText("💰 " + Game.coins, W/2, H/2 - 145);
  }
  drawButton("НАЧАТЬ ИГРУ", W/2-200, H/2+20, 400, 70, '#2eb45a', '#3cd26e');
  drawButton("КОЛЛЕКЦИЯ БОССОВ", W/2-200, H/2+100, 400, 70, '#5082dc', '#64a0f0');
  drawButton("ДОСТИЖЕНИЯ", W/2-200, H/2+180, 400, 70, '#c87e28', '#ffa03c');
  drawButton("МАГАЗИН СКИНОВ", W/2-200, H/2+260, 400, 70, '#9648c8', '#c864ff');
  drawButton("ВЫХОД", W/2-200, H/2+340, 400, 70, '#b43232', '#dc4646');
  ctx.font = F.upgDesc;
  ctx.fillStyle = 'rgb(110,60,30)';
  ctx.textAlign = 'center';
  ctx.fillText("← → двигать | Пробел / клик — стрелять | Esc — пауза", W/2, H - 30);
}

function drawButton(text, x, y, w, h, baseColor, hoverColor) {
  const isHover = Game.mouse.x >= x && Game.mouse.x <= x+w && Game.mouse.y >= y && Game.mouse.y <= y+h;
  ctx.save();
  ctx.shadowColor = isHover ? hoverColor : baseColor;
  ctx.shadowBlur = isHover ? 30 : 15;
  ctx.fillStyle = isHover ? hoverColor : baseColor;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
  ctx.strokeStyle = 'white'; ctx.lineWidth = 4;
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = 'white';
  ctx.font = F.menu;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w/2, y + h/2);
}

function drawCollection() {
  const allTypes = BOSS_TYPES.concat([FINAL_BOSS]);
  ctx.font = F.big;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#8c2814';
  ctx.fillText("КОЛЛЕКЦИЯ", W/2 + 5, 95);
  ctx.fillStyle = 'white';
  ctx.fillText("КОЛЛЕКЦИЯ", W/2, 90);
  const defeated = allTypes.filter(b => (Game.collection[b.id] || 0) > 0).length;
  ctx.font = F.upg;
  ctx.fillStyle = '#fff0c8';
  ctx.fillText(`Побеждено: ${defeated} / ${allTypes.length}`, W/2, 145);
  const cardW = 300, cardH = 180, gapX = 30, gapY = 20;
  const cols = 2;
  const totalW = cols * cardW + (cols-1) * gapX;
  const startX = (W - totalW) / 2;
  const startY = 175;
  for (let i = 0; i < allTypes.length; i++) {
    const bt = allTypes[i];
    const row = Math.floor(i / cols);
    const col = i % cols;
    const x = startX + col * (cardW + gapX);
    const y = startY + row * (cardH + gapY);
    const isDef = (Game.collection[bt.id] || 0) > 0;
    const isHover = Game.mouse.x >= x && Game.mouse.x <= x+cardW && Game.mouse.y >= y && Game.mouse.y <= y+cardH;
    ctx.save();
    if (isDef) { ctx.shadowColor = bt.color; ctx.shadowBlur = isHover ? 30 : 15; }
    ctx.fillStyle = isHover ? '#37405a' : '#232a3c';
    ctx.fillRect(x, y, cardW, cardH);
    ctx.restore();
    ctx.strokeStyle = isDef ? bt.color : '#505050';
    ctx.lineWidth = 4;
    ctx.strokeRect(x, y, cardW, cardH);
    const fx = x + 65, fy = y + cardH/2, fr = 40;
    if (isDef) drawBossFace(ctx, fx, fy, fr, bt);
    else {
      ctx.fillStyle = '#3c3c46';
      ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#1e1e28'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#9696a0'; ctx.font = F.big;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText("?", fx, fy);
    }
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    if (isDef) {
      ctx.fillStyle = 'white'; ctx.font = F.col;
      ctx.fillText(bt.name, x + 120, y + 25);
      ctx.fillStyle = '#c8c8c8'; ctx.font = F.upgDesc;
      ctx.fillText(bt.desc, x + 120, y + 55);
      ctx.fillStyle = '#ffdc64'; ctx.font = F.upgDesc;
      ctx.fillText(`Побеждён: ${Game.collection[bt.id] || 0} раз`, x + 120, y + 85);
    } else {
      ctx.fillStyle = '#9696a0'; ctx.font = F.col;
      ctx.fillText("???", x + 120, y + 25);
      ctx.fillStyle = '#787882'; ctx.font = F.upgDesc;
      ctx.fillText("Ещё не побеждён", x + 120, y + 55);
    }
  }
  ctx.fillStyle = '#fff0c8'; ctx.font = F.upgDesc;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText("Esc или клик в левом верхнем углу — назад", W/2, H - 30);
}

function drawAchievements() {
  ctx.font = F.big;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#8c2814';
  ctx.fillText("ДОСТИЖЕНИЯ", W/2 + 5, 95);
  ctx.fillStyle = 'white';
  ctx.fillText("ДОСТИЖЕНИЯ", W/2, 90);
  const unlocked = ACHIEVEMENTS.filter(a => Game.achievements[a.id]).length;
  ctx.font = F.upg;
  ctx.fillStyle = '#fff0c8';
  ctx.fillText(`Открыто: ${unlocked} / ${ACHIEVEMENTS.length}`, W/2, 145);
  ctx.fillStyle = '#ffd700';
  ctx.fillText("💰 " + Game.coins, W/2, 175);
  const startY = 210;
  const rowH = 52;
  for (let i = 0; i < ACHIEVEMENTS.length; i++) {
    const a = ACHIEVEMENTS[i];
    const y = startY + i * rowH;
    const unlocked = Game.achievements[a.id];
    ctx.fillStyle = unlocked ? 'rgba(60,180,90,0.25)' : 'rgba(35,42,60,0.7)';
    ctx.fillRect(40, y, W - 80, rowH - 8);
    ctx.strokeStyle = unlocked ? '#3cdc64' : '#505050';
    ctx.lineWidth = 2;
    ctx.strokeRect(40, y, W - 80, rowH - 8);
    ctx.font = "bold 28px Arial"; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = unlocked ? '#ffdc64' : '#505050';
    ctx.fillText(unlocked ? "✓" : "○", 55, y + 22);
    ctx.font = F.upg;
    ctx.fillStyle = unlocked ? 'white' : '#787882';
    ctx.fillText(a.name, 95, y + 14);
    ctx.font = F.upgDesc;
    ctx.fillStyle = unlocked ? '#c8c8c8' : '#505060';
    ctx.fillText(a.desc, 95, y + 33);
    ctx.font = F.upg;
    ctx.textAlign = 'right';
    ctx.fillStyle = unlocked ? '#ffd700' : '#404050';
    ctx.fillText("+" + a.reward + " 💰", W - 60, y + 22);
  }
  ctx.fillStyle = '#fff0c8'; ctx.font = F.upgDesc;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText("Esc или клик в левом верхнем углу — назад", W/2, H - 15);
}

function drawShop() {
  ctx.font = F.big;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#8c2814';
  ctx.fillText("МАГАЗИН", W/2 + 5, 95);
  ctx.fillStyle = 'white';
  ctx.fillText("МАГАЗИН", W/2, 90);
  ctx.font = F.upg;
  ctx.fillStyle = '#ffd700';
  ctx.fillText("💰 " + Game.coins, W/2, 145);
  const cardW = 300, cardH = 140, gapX = 30, gapY = 20;
  const cols = 2;
  const totalW = cols * cardW + (cols-1) * gapX;
  const startX = (W - totalW) / 2;
  const startY = 180;
  for (let i = 0; i < SKINS.length; i++) {
    const skin = SKINS[i];
    const row = Math.floor(i / cols);
    const col = i % cols;
    const x = startX + col * (cardW + gapX);
    const y = startY + row * (cardH + gapY);
    const owned = skin.cost === 0 || Game.achievements['skin_' + skin.id];
    const current = Game.currentSkin === skin.id;
    const isHover = Game.mouse.x >= x && Game.mouse.x <= x+cardW && Game.mouse.y >= y && Game.mouse.y <= y+cardH;
    ctx.save();
    if (owned) { ctx.shadowColor = skin.glow; ctx.shadowBlur = isHover ? 30 : 12; }
    ctx.fillStyle = isHover ? '#37405a' : '#232a3c';
    ctx.fillRect(x, y, cardW, cardH);
    ctx.restore();
    ctx.strokeStyle = current ? '#ffdc64' : (owned ? skin.glow : '#505050');
    ctx.lineWidth = 4;
    ctx.strokeRect(x, y, cardW, cardH);
    // Cannon preview
    const previewX = x + 80, previewY = y + cardH/2;
    let color = skin.color === 'rainbow' ? rainbow(performance.now() * 0.003) : skin.color;
    ctx.fillStyle = color || '#34495e';
    ctx.fillRect(previewX - 30, previewY - 30, 60, 60);
    ctx.fillStyle = skin.color === 'rainbow' ? rainbow(performance.now() * 0.003 + 1) : (skin.color || '#2c3e50');
    ctx.fillRect(previewX - 8, previewY - 45, 16, 30);
    ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
    ctx.strokeRect(previewX - 30, previewY - 30, 60, 60);
    // Info
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'white'; ctx.font = F.col;
    ctx.fillText(skin.name, x + 140, y + 25);
    ctx.font = F.upgDesc;
    if (current) { ctx.fillStyle = '#3cdc64'; ctx.fillText("НАДЕТА", x + 140, y + 55); }
    else if (owned) { ctx.fillStyle = '#ffdc64'; ctx.fillText("Купить →", x + 140, y + 55); }
    else { ctx.fillStyle = '#ffd700'; ctx.fillText("💰 " + skin.cost, x + 140, y + 55); }
  }
  ctx.fillStyle = '#fff0c8'; ctx.font = F.upgDesc;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText("Esc — назад | Клик по скину — выбрать/купить", W/2, H - 30);
}

function drawPlay() {
  const cannon = Game.cannon;
  if (!cannon) return;
  ctx.strokeStyle = 'rgb(40,140,50)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, Game.groundY); ctx.lineTo(W, Game.groundY); ctx.stroke();
  for (const p of particles) p.draw(ctx);
  for (const b of Game.balls) b.draw(ctx);
  for (const p of Game.bossProjectiles) p.draw(ctx);
  for (const b of Game.bullets) b.draw(ctx);
  if (Game.boss) Game.boss.draw(ctx);
  cannon.draw(ctx);
  for (const ft of floatTexts) ft.draw(ctx);

  // UI
  ctx.fillStyle = 'white'; ctx.font = F.font;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(`Очки: ${Game.score}`, 20, 20);
  ctx.font = F.upgDesc;
  ctx.fillStyle = 'rgb(200,200,120)';
  ctx.fillText(`Урон ${cannon.damage}  •  Пули ${cannon.multishot}  •  Пробой ${cannon.pierce}  •  Щит ${cannon.shield}`, 20, 55);
  ctx.fillStyle = 'rgb(255,200,100)';
  ctx.fillText(`Прокачек: ${cannon.upgradesCount}  •  До улучшения: ${Game.bigKillsCounter}/${Game.bigKillsNeeded}`, 20, 75);
  if (cannon.critChance > 0) {
    ctx.fillStyle = 'rgb(255,150,150)';
    ctx.fillText(`Крит: ${Math.floor(cannon.critChance*100)}%  x${cannon.critMult.toFixed(1)}`, 20, 95);
  }
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText(`FPS: ${Game.fps}`, W - 20, 20);
  ctx.fillStyle = 'rgba(255,220,100,0.7)';
  ctx.fillText(`🏆 ${Game.highScore}  💰 ${Game.coins}`, W - 20, 40);

  if (!Game.finalBossSpawned) {
    const progress = Math.min(1, Game.score / 2500);
    const barW = 250, barH = 14, barX = 20, barY = 118;
    ctx.fillStyle = 'rgb(40,20,60)';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = 'rgb(255,200,50)';
    ctx.fillRect(barX, barY, barW * progress, barH);
    ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barW, barH);
    ctx.fillStyle = 'rgb(255,240,180)'; ctx.font = F.upgDesc;
    ctx.textAlign = 'left';
    ctx.fillText(`ФИНАЛ: ${Game.score}/2500`, barX + barW + 10, barY);
  }

  if (Game.boss) {
    const barW = W - 80, barH = 26, barX = 40, barY = 145;
    ctx.fillStyle = 'rgb(60,20,30)';
    ctx.fillRect(barX, barY, barW, barH);
    const ratio = Math.max(0, Game.boss.hp / Game.boss.hpMax);
    ctx.save();
    ctx.shadowColor = Game.boss.isFinal ? '#ff3c78' : '#e63c50';
    ctx.shadowBlur = 20;
    ctx.fillStyle = Game.boss.isFinal ? 'rgb(255,60,120)' : 'rgb(230,60,80)';
    ctx.fillRect(barX, barY, barW * ratio, barH);
    ctx.restore();
    ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barW, barH);
    ctx.fillStyle = 'white'; ctx.font = F.boss;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const prefix = Game.boss.isFinal ? "ФИНАЛЬНЫЙ" : `БОСС: ${Game.boss.bossType.name}`;
    ctx.fillText(`${prefix}  ${Math.max(0, Game.boss.hp)}/${Game.boss.hpMax}`, W/2, barY + barH/2);
  }

  // Rage indicator
  if (Game.rageActive) {
    ctx.fillStyle = '#ff3c3c'; ctx.font = "bold 26px Arial";
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.save(); ctx.shadowColor = '#ff3c3c'; ctx.shadowBlur = 25;
    ctx.fillText("🔥 ЯРОСТЬ x1.5 " + Math.ceil(Game.rageTimer) + "с", W/2, 20);
    ctx.restore();
  }

  if (Game.combo > 1) {
    const alpha = Math.min(1, Game.comboTimer);
    ctx.globalAlpha = alpha;
    ctx.font = F.combo;
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    const cc = Game.combo >= 20 ? '#ff3c78' : Game.combo >= 10 ? '#ff8c00' : '#ffc832';
    ctx.fillStyle = cc;
    ctx.save();
    ctx.shadowColor = cc; ctx.shadowBlur = 20;
    ctx.fillText(`x${Game.combo}`, W - 20, 80);
    ctx.restore();
    ctx.font = F.upg;
    ctx.fillStyle = 'white';
    ctx.fillText("КОМБО", W - 20, 125);
    ctx.globalAlpha = 1;
  }

  if (Game.announceTimer > 0) {
    const totalDur = 2;
    const t = Game.announceTimer;
    const alpha = t > totalDur - 0.3 ? (totalDur - t) / 0.3 : Math.min(1, t / 0.5);
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    ctx.font = F.announce;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.save();
    ctx.shadowColor = Game.announceColor; ctx.shadowBlur = 40;
    ctx.fillStyle = 'black';
    ctx.fillText(Game.announceText, W/2 + 4, H/2 - 80 + 4);
    ctx.fillStyle = Game.announceColor;
    ctx.fillText(Game.announceText, W/2, H/2 - 80);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  if (Game.toastTimer > 0) {
    const alpha = Math.min(1, Game.toastTimer / 30);
    ctx.globalAlpha = alpha;
    ctx.font = F.upg;
    const tw = ctx.measureText(Game.toastText).width;
    ctx.fillStyle = 'rgb(40,180,90)';
    ctx.fillRect(W/2 - tw/2 - 12, H/2 - 160, tw + 24, 30);
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(Game.toastText, W/2, H/2 - 145);
    ctx.globalAlpha = 1;
  }

  if (!Game.gameOver) {
    ctx.fillStyle = 'rgb(240,240,240)'; ctx.font = F.hint;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText("← → | Пробел/W/Up/Клик — стрелять | L — картинка | Esc — пауза", 20, H - 30);
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgb(231,76,60)'; ctx.font = F.big;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.save(); ctx.shadowColor = '#ff3c3c'; ctx.shadowBlur = 30;
    ctx.fillText("GAME OVER", W/2, H/2 - 120); ctx.restore();
    ctx.fillStyle = 'white'; ctx.font = F.font;
    ctx.fillText(`Очки: ${Game.score}`, W/2, H/2 - 40);
    ctx.fillText(`Макс. комбо: x${Game.maxCombo}`, W/2, H/2);
    ctx.fillText(`Убито шаров: ${Game.totalKills}`, W/2, H/2 + 40);
    if (Game.score >= Game.highScore && Game.score > 0) {
      ctx.fillStyle = '#ffdc64'; ctx.font = F.upg;
      ctx.fillText("🏆 НОВЫЙ РЕКОРД!", W/2, H/2 + 80);
    }
    ctx.fillStyle = 'white'; ctx.font = F.hint;
    ctx.fillText("R — заново   |   M — в меню", W/2, H/2 + 130);
  }
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'white'; ctx.font = F.big;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save(); ctx.shadowColor = '#ffdc64'; ctx.shadowBlur = 30;
  ctx.fillText("ПАУЗА", W/2, H/2 - 180);
  ctx.restore();
  drawButton("ПРОДОЛЖИТЬ", W/2-150, H/2-60, 300, 60, '#2eb45a', '#3cd26e');
  drawButton("В МЕНЮ", W/2-150, H/2+20, 300, 60, '#5082dc', '#64a0f0');
  ctx.fillStyle = 'white'; ctx.font = F.font;
  ctx.fillText(`Очки: ${Game.score}`, W/2, H/2 + 130);
  ctx.fillText(`Комбо: x${Game.combo}`, W/2, H/2 + 170);
  ctx.fillText(`Прокачек: ${Game.cannon.upgradesCount}`, W/2, H/2 + 210);
}

function drawUpgrade() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, W, H);
  const cardW = 560, cardH = 110, gap = 18;
  const totalH = Game.upgradeChoices.length * cardH + (Game.upgradeChoices.length-1) * gap;
  const startY = (H - totalH) / 2 + 40;
  ctx.font = F.upgTitle;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save(); ctx.shadowColor = '#ffe664'; ctx.shadowBlur = 30;
  ctx.fillStyle = 'rgb(255,230,100)';
  ctx.fillText("УЛУЧШЕНИЕ!", W/2, startY - 70); ctx.restore();
  ctx.font = F.upgDesc;
  ctx.fillStyle = 'rgb(200,200,200)';
  ctx.fillText("Клик по карточке или 1/2/3", W/2, startY - 32);
  for (let i = 0; i < Game.upgradeChoices.length; i++) {
    const up = Game.upgradeChoices[i];
    const cy = startY + i * (cardH + gap);
    const rx = (W - cardW) / 2;
    const isHover = Game.mouse.x >= rx && Game.mouse.x <= rx+cardW && Game.mouse.y >= cy && Game.mouse.y <= cy+cardH;
    ctx.save();
    ctx.shadowColor = TIER_RING[up.tier]; ctx.shadowBlur = isHover ? 25 : 10;
    ctx.fillStyle = isHover ? 'rgb(60,70,95)' : 'rgb(35,42,60)';
    ctx.fillRect(rx, cy, cardW, cardH);
    ctx.restore();
    ctx.strokeStyle = TIER_RING[up.tier] || '#b4b4b4';
    ctx.lineWidth = 4;
    ctx.strokeRect(rx, cy, cardW, cardH);
    ctx.save();
    ctx.shadowColor = up.color; ctx.shadowBlur = 15;
    ctx.fillStyle = up.color;
    ctx.beginPath(); ctx.arc(rx + 60, cy + cardH/2, 34, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'white'; ctx.font = F.big;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText((i+1).toString(), rx + 60, cy + cardH/2);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'white'; ctx.font = F.upg;
    ctx.fillText(up.name, rx + 120, cy + 22);
    ctx.fillStyle = 'rgb(200,200,200)'; ctx.font = F.upgDesc;
    ctx.fillText(up.desc, rx + 120, cy + 58);
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillStyle = TIER_RING[up.tier] || '#b4b4b4';
    ctx.font = F.upgDesc;
    ctx.fillText(up.tier.toUpperCase(), rx + cardW - 15, cy + 10);
  }
}

function drawVictory() {
  const elapsed = Game.stateTime;
  const pulse = Math.sin(elapsed * 0.005) * 10;
  if (Math.random() < 0.3) {
    const x = Math.random() * W, y = Math.random() * H * 0.5;
    const colors = ['#ff3c78', '#ffdc64', '#3cd2ff', '#3cdc64', '#c83cff'];
    spawnExplosion(x, y, colors[Math.floor(Math.random()*colors.length)], 15, 6);
  }
  for (const p of particles) p.draw(ctx);
  drawBossFace(ctx, W/2, H/2 - 100, 90 + pulse, FINAL_BOSS);
  ctx.font = F.big;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save(); ctx.shadowColor = '#ffe664'; ctx.shadowBlur = 40;
  ctx.fillStyle = '#8c2814';
  ctx.fillText("ПОБЕДА!", W/2 + 5, H/2 + 85);
  ctx.fillStyle = 'white';
  ctx.fillText("ПОБЕДА!", W/2, H/2 + 80); ctx.restore();
  ctx.font = F.font;
  ctx.fillStyle = 'white';
  ctx.fillText(`Очки: ${Game.score}`, W/2, H/2 + 160);
  ctx.fillText(`Комбо: x${Game.maxCombo}  •  Убито: ${Game.totalKills}`, W/2, H/2 + 200);
  ctx.font = F.upg;
  ctx.fillStyle = '#fff0c8';
  ctx.fillText("Клик — продолжить в бесконечном режиме", W/2, H - 80);
}

// ==================== MAIN LOOP ====================
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
</body>
</html>
